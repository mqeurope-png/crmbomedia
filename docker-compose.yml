services:
  db:
    image: mysql:8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucrm", "-pcrm"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://crm:crm@db:3306/crm
      REDIS_URL: redis://redis:6379/0
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-change-me-admin-password}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # Sprint-Backfill-Gmail. Misma carpeta que worker-sync para que
      # el endpoint de download sirva los adjuntos que el worker baja.
      - crmbo_email_attachments:/var/lib/crmbo/attachments
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-sync:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://crm:crm@db:3306/crm
      REDIS_URL: redis://redis:6379/0
    # PR-Fix-Worker-Dedicado-Workflows. Worker A en dev: queues de
    # sync + housekeeping. Mismas que prod (excepto `backups:create`
    # que en dev no se monta el script). Ver
    # `docker-compose.prod.yml` para la justificación arquitectónica.
    command:
      - rq
      - worker
      # --with-scheduler powers Brevo's self-rescheduling heartbeats
      # (auto-sync targets + campaign cache refresh) via enqueue_in.
      - --with-scheduler
      - --url
      - redis://redis:6379/0
      # PR-Fix-Web-Ingest-Starvation. AgileCRM → `worker-agilecrm`, ingesta
      # web (woocommerce:*) → `worker-web`. Antes ambas copaban este worker
      # (Agile cola #1, jobs largos) y RQ procesa colas en orden, así que
      # los webhooks Woo (cola #35) se atascaban. Ver docker-compose.prod.yml.
      - brevo:sync_contacts
      - brevo:push_target
      - brevo:auto_sync_check
      - brevo:push_contact
      - brevo:webhook_process
      - brevo:refresh_campaigns
      - brevo:refresh_segments
      - brevo:refresh_segment
      - brevo:periodic_read
      - brevo:periodic_segments
      - brevo:periodic_push
      - brevo:historical_backfill
      - freshdesk:sync_tickets
      - factusol:sync_invoices
      - gmail:process_history
      - gmail:renew_watches
      - gmail:backfill_historic
      - gmail:backfill_per_contact
      - gmail:token_expiry_check
      - gmail:admin_digest
      - gmail:sync_aliases
      - gmail:poll_fallback
      - emails:snooze_sweep
      - email_templates:import_gmail
      # Genei (etiquetas + tracking async). La ingesta web (woocommerce:*)
      # se mudó a `worker-web` (PR-Fix-Web-Ingest-Starvation); Genei no es
      # ruta crítica de pedido y se queda aquí.
      - genei:shipments
      - genei:webhooks
    volumes:
      # Sprint-Backfill-Gmail. El worker baja los adjuntos a este volume;
      # api los sirve via FileResponse desde el mismo volume.
      - crmbo_email_attachments:/var/lib/crmbo/attachments
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PR-Fix-Web-Ingest-Starvation. Worker DEDICADO a la ingesta web (dev).
  # Solo ve woocommerce:* — nunca lo bloquea AgileCRM. `woocommerce:webhooks`
  # va primero. Ver docker-compose.prod.yml para la justificación.
  worker-web:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://crm:crm@db:3306/crm
      REDIS_URL: redis://redis:6379/0
    command:
      - rq
      - worker
      - --url
      - redis://redis:6379/0
      - woocommerce:webhooks
      - woocommerce:import
      - woocommerce:backfill
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PR-Fix-Web-Ingest-Starvation. Worker de baja prioridad, aislado, para
  # AgileCRM (en retirada). --with-scheduler para el heartbeat
  # `agilecrm:periodic_read` (encola sync_contacts cada
  # AGILECRM_SYNC_INTERVAL_HOURS, default 1). Ver docker-compose.prod.yml.
  worker-agilecrm:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://crm:crm@db:3306/crm
      REDIS_URL: redis://redis:6379/0
    command:
      - rq
      - worker
      - --with-scheduler
      - --url
      - redis://redis:6379/0
      - agilecrm:periodic_read
      - agilecrm:sync_contacts
      - agilecrm:purge_quota
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-workflows:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://crm:crm@db:3306/crm
      REDIS_URL: redis://redis:6379/0
    # PR-Fix-Worker-Dedicado-Workflows. Worker B en dev: motor de
    # workflows. En dev este worker no existía antes — los eventos
    # `contact.created` quedaban en Redis sin procesarse, y todos
    # los tests de workflows usaban el fallback inline. Tenerlo
    # arrancado en dev cubre el camino real (RQ enqueue + worker
    # pop) y permite reproducir el bug que vimos en prod.
    command:
      - rq
      - worker
      - --with-scheduler
      - --url
      - redis://redis:6379/0
      - workflows:dispatch
      - workflows:execute
      - workflows:scheduler
      # Fase VIES: barrido periódico (self-rescheduling, necesita
      # --with-scheduler) de los NIF-IVA pendientes de veredicto.
      - vies:sweep
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # BoHub ERP Fase C · C-2. Worker dedicado a escrituras FACTUSOL, cola única
  # `factusol:writes`, concurrencia 1 (numeración CODFAC secuencial).
  worker-factusol:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://crm:crm@db:3306/crm
      REDIS_URL: redis://redis:6379/0
    command:
      - rq
      - worker
      - --url
      - redis://redis:6379/0
      # ERP-jobs-interactivos: cola de los trabajos que un usuario lanza y
      # espera (reconciliación de estados Woo). Prioridad sobre factusol:writes.
      - erp:interactive
      - factusol:writes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PR-CRM-GMAIL-fix1. Worker dedicado SOLO a colas Gmail (post PR #329).
  # Motivo: el worker-sync se satura con el bucle de sync AgileCRM
  # (paginación de miles de contactos) y RQ procesa colas secuencial
  # dentro de un worker → gmail:process_history acumulaba jobs sin
  # procesar (Pub/Sub llegaba pero el mail nunca aparecía en CRM en
  # real-time). worker-sync sigue escuchando estas colas también; RQ
  # reparte jobs entre workers cuando 2+ escuchan la misma cola, así
  # ganamos capacidad sin tocar la config existente.
  worker-gmail:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://crm:crm@db:3306/crm
      REDIS_URL: redis://redis:6379/0
    command:
      - rq
      - worker
      - --with-scheduler
      - --url
      - redis://redis:6379/0
      - gmail:process_history
      - gmail:renew_watches
      - gmail:backfill_historic
      - gmail:backfill_per_contact
      - gmail:token_expiry_check
      - gmail:admin_digest
      - gmail:sync_aliases
      - gmail:poll_fallback
    volumes:
      - crmbo_email_attachments:/var/lib/crmbo/attachments
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  # Sprint-Backfill-Gmail. Binarios de adjuntos descargados por el
  # backfill. Compartido entre api y worker-sync.
  crmbo_email_attachments:
