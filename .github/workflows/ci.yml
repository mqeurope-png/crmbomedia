name: CI

# Tres zonas y un solo check para la rama:
#
#   - `changes` mira qué toca el PR (dorny/paths-filter). Un PR solo de
#     frontend no lanza el backend, y al revés; lo compartido (este fichero,
#     docker-compose, Dockerfiles, dependencias) lo lanza todo. En `main`
#     (push) no se filtra: corre todo. Si el filtro fallara, también.
#   - `backend` corre la suite de pytest en 8 trozos en paralelo
#     (`.github/scripts/pytest_shard.py`): la misma suite, repartida, en vez
#     de un trabajo de media hora. ruff y compileall van en el trozo 1.
#   - `backend-mysql` solo cuando el PR toca la base de datos (migraciones,
#     modelos, dependencias) o algo compartido.
#   - `frontend` con la caché de npm por el lock.
#   - `ci-ok` es el único check que hay que exigir en la protección de la
#     rama: pasa cuando todo lo que tenía que correr corrió bien; un trabajo
#     saltado por los filtros no bloquea el PR.
#
# Un empujón nuevo a la misma rama cancela la ejecución anterior (solo en
# PRs; en `main` se dejan terminar).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTEST_SHARDS: 8

jobs:
  changes:
    name: qué cambia
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      db: ${{ steps.filter.outputs.db }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/**'
              - 'docker-compose*.yml'
              - '**/Dockerfile*'
              - '.dockerignore'
              - 'nginx/**'
            backend:
              - *shared
              - 'backend/**'
            db:
              - *shared
              - 'backend/alembic/**'
              - 'backend/alembic.ini'
              - 'backend/app/models/**'
              - 'backend/app/**/models.py'
              - 'backend/app/db/**'
              - 'backend/requirements*.txt'
            frontend:
              - *shared
              - 'frontend/**'

  backend:
    name: backend (${{ matrix.shard }}/8)
    needs: changes
    # Corre si no es un PR (push a main), si el filtro no pudo decidir, o si
    # el PR toca el backend o algo compartido.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: backend
    env:
      # Tag any error captured by Sentry with the commit that produced it.
      # The SDK only emits events when SENTRY_DSN is set at runtime.
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - if: matrix.shard == 1
        run: ruff check .
      - if: matrix.shard == 1
        run: python -m compileall app tests
      - name: pytest (trozo ${{ matrix.shard }} de ${{ env.PYTEST_SHARDS }})
        run: |
          python ../.github/scripts/pytest_shard.py --shards "$PYTEST_SHARDS" --index "${{ matrix.shard }}" > /tmp/trozo.txt
          xargs -a /tmp/trozo.txt python -m pytest

  backend-mysql:
    # Catches MySQL-only schema bugs that SQLite happily accepts.
    # Historically we shipped at least three migrations (||/concat,
    # NULLS LAST, DEFAULT on TEXT) that passed CI on SQLite and
    # broke production. This job runs the full migration chain
    # against MySQL 8 plus a minimal insert sanity check.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.db == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: crm_test
          MYSQL_USER: crm
          MYSQL_PASSWORD: crmpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucrm -pcrmpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql+pymysql://crm:crmpw@127.0.0.1:3306/crm_test
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -ucrm -pcrmpw --silent; then
              echo "mysql ready"; exit 0
            fi
            sleep 2
          done
          echo "mysql never came up" >&2; exit 1
      - name: Alembic upgrade head (catches DEFAULT-on-TEXT / NULLS LAST / || class of bugs)
        env:
          INTEGRATION_SECRETS_KEY: ${{ secrets.INTEGRATION_SECRETS_KEY }}
        run: |
          # Seed a throwaway key if the repo secret isn't set so the
          # smoke job works on forks/PRs without secret access.
          if [ -z "$INTEGRATION_SECRETS_KEY" ]; then
            export INTEGRATION_SECRETS_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          fi
          alembic upgrade head
      - name: Application-layer defaults round-trip on MySQL
        # The pytest suite uses in-memory SQLite by design, so we script
        # a tiny insert/select cycle through the real models against the
        # live MySQL service. Catches NOT NULL columns whose DEFAULT lives
        # only in the ORM — the failure mode that shipped composer 0033.
        env:
          DATABASE_URL: mysql+pymysql://crm:crmpw@127.0.0.1:3306/crm_test
        run: |
          export INTEGRATION_SECRETS_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          python - <<'PY'
          from datetime import UTC, datetime

          from app.db.session import get_engine
          from app.email_templates.models import (
              EmailTemplate,
              EmailTemplateFolder,
          )
          from sqlalchemy.orm import Session

          now = datetime.now(UTC)
          # Insert each row in its own commit so the smoke doesn't lean
          # on SQLAlchemy's FK-aware flush ordering. The intent here is
          # to round-trip server_defaults on MySQL, not to exercise
          # relational dependencies.
          with Session(get_engine()) as s:
              s.add(
                  EmailTemplateFolder(
                      id="smoke-folder",
                      name="Smoke",
                      created_at=now,
                      updated_at=now,
                  )
              )
              s.commit()
              s.add(
                  EmailTemplate(
                      id="smoke-template",
                      name="Smoke template",
                      body_html="<p>hola</p>",
                      folder_id="smoke-folder",
                      created_at=now,
                      updated_at=now,
                  )
              )
              s.commit()
              tpl = s.get(EmailTemplate, "smoke-template")
              assert tpl is not None
              assert tpl.is_global is False
              assert tpl.usage_count == 0
              assert s.get(EmailTemplateFolder, "smoke-folder").is_global is False
          print("mysql.email_templates.smoke ok")
          PY

  frontend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      GIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # SEC-1: Node 20 llegó a EOL en abril-2026; Next 16 exige >=20.9.
          # 22 = LTS activa, la misma major que la imagen Docker del frontend.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --ci --coverage=false

  ci-ok:
    # El único check que hay que exigir en la protección de la rama. En
    # verde si todo lo que tenía que correr corrió bien; un trabajo saltado
    # por los filtros de ruta no bloquea.
    name: CI en verde
    needs: [changes, backend, backend-mysql, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado de cada trabajo
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTADOS"])
          for nombre, datos in needs.items():
              print(f"{nombre}: {datos['result']}")
          malos = {n: d["result"] for n, d in needs.items() if d["result"] in ("failure", "cancelled")}
          if malos:
              sys.exit(f"Trabajos en rojo: {malos}")
          print("CI en verde")
          PY
