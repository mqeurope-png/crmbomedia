ap:12px\"><span style=\"color:#6b7280\">Factura<\u002Fspan><span style=\"font-family:'Geist Mono',monospace\">F-2026/118<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;font-size:13px;color:#6b7280;line-height:1.6\">Solo lectura. FACTUSOL es la fuente de verdad fiscal.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- paneles plegados con resumen -->\n            <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n              <div style=\"flex:1 1 140px;min-width:0\"><div style=\"font-size:15px;font-weight:600\">Líneas del pedido<\u002Fdiv><div style=\"font-size:13px;color:#6b7280;margin-top:2px\">3 artículos · portes 45,00 €<\u002Fdiv><\u002Fdiv>\n              <span style=\"color:#9aa2ad;font-size:14px\">▾<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n              <div style=\"flex:1 1 140px;min-width:0\"><div style=\"font-size:15px;font-weight:600\">Envío y seguimiento<\u002Fdiv><div style=\"font-size:13px;color:#6b7280;margin-top:2px\">Sin expedición · pendiente de SAT<\u002Fdiv><\u002Fdiv>\n              <span style=\"color:#9aa2ad;font-size:14px\">▾<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n              <div style=\"flex:1 1 140px;min-width:0\"><div style=\"font-size:15px;font-weight:600\">Historial<\u002Fdiv><div style=\"font-size:13px;color:#6b7280;margin-top:2px\">9 eventos · último hace 2 h<\u002Fdiv><\u002Fdiv>\n              <span style=\"color:#9aa2ad;font-size:14px\">▾<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border:1px solid #f3c9c5;border-radius:12px;padding:16px 18px;background:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n              <div style=\"flex:1 1 140px;min-width:0\"><div style=\"font-size:14px;font-weight:600;color:#b42318\">Anular pedido<\u002Fdiv><div style=\"font-size:13px;color:#6b7280;margin-top:2px\">Requiere confirmación escrita<\u002Fdiv><\u002Fdiv>\n              <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;border:1px solid #f3c9c5;color:#b42318;font-size:13px;font-weight:500\">Anular<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:4px\">Decisiones del mockup<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">Línea de vida vertical.<\u002Fstrong> Los 7 pasos en columna: cabe en cualquier ancho, cada paso muestra su dato (nº de albarán, de factura, fecha) y su propia acción. El paso actual es la única tarjeta azul de la pantalla.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Barra de 7 segmentos en la cabecera.<\u002Fstrong> Da la lectura rápida («paso 6 de 7») sin tener que recorrer la línea de vida.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Fin de los botones duplicados.<\u002Fstrong> La cabecera repite <em>solo<\u002Fem> el primario del paso actual, y agrupa el resto en «Documentos» y «⋯». Cada documento se descarga desde su paso.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Pendiente de cobro destacado.<\u002Fstrong> Es el dato que más se consulta; va en bloque ámbar con cifra grande, dentro del resumen económico.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Paneles plegados con resumen.<\u002Fstrong> Líneas, envío e historial se cierran, pero su cabecera cuenta lo esencial («3 artículos», «9 eventos»). Se pierde cero información y se gana una pantalla legible.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Anular aislado.<\u002Fstrong> Al final de la columna, en su propia tarjeta con borde rojo y confirmación escrita. Imposible pulsarlo por error.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Migas con la cola de origen.<\u002Fstrong> «← Bandeja · Por cobrar» devuelve al usuario exactamente a donde estaba, no a la bandeja por defecto.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 4 · FICHA DE EMPRESA ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">4<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Ficha de empresa<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Se abre para responder tres cosas: si los datos fiscales están bien, si está vinculada a FACTUSOL y qué se ha hecho con ella últimamente. Hoy las tres conviven al mismo nivel.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>Tener el régimen de IVA calculado desde el país evita el error más caro del proceso.<\u002Fdiv>\n          <div>La actividad reciente en la propia ficha ahorra ir a buscar los pedidos de ese cliente.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">El estado de vínculo se entierra.<\u002Fstrong> «Solo CRM» o «en FACTUSOL» determina qué se puede hacer: va en la cabecera, no en un panel.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Archivada no se distingue.<\u002Fstrong> Tras la limpieza hay fichas archivadas que se leen igual que las activas. Necesitan banda de aviso y acciones desactivadas con explicación.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Actividad en tres listas.<\u002Fstrong> Pedidos, facturas y proformas separados obligan a mirar tres sitios para saber qué pasó. Una sola tabla con filtro por tipo.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">VIES sin fecha.<\u002Fstrong> Un VAT validado hace dos años no vale igual que uno de hoy: mostrar cuándo se comprobó.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e7e9ee;border-radius:14px;overfl na sola actividad.<\u002Fstrong> Tabla de consulta con filtro por tipo: documento, fecha, importe alineado a la derecha y estado. Sustituye las tres listas sin perder ninguna.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Datos fiscales en panel de pares.<\u002Fstrong> Con la fila VIES siempre presente, aunque diga «No aplica», para que el hueco no genere dudas.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Archivar y borrar en «⋯».<\u002Fstrong> Y si la ficha está archivada, banda gris arriba con el motivo y la fecha, y «Reactivar» como primario.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 5 · PROFORMAS ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">5<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Proformas<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Hereda el patrón de la bandeja: colas por acción y fila de trabajo. La única acción que de verdad importa es «Convertir en pedido», y hoy compite con el resto.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>Las cuatro colas son las correctas y «aceptadas · por convertir» es exactamente la cola de trabajo real.<\u002Fdiv>\n          <div>Mostrar importe y régimen en la fila evita abrir la proforma para saber si interesa.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">No se ve la antigüedad.<\u002Fstrong> Una proforma pendiente de 40 días es una acción comercial; una de 2 días, no. Hace falta «hace X días» y orden por antigüedad.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Convertida sin rastro visible.<\u002Fstrong> Debe enlazar al pedido resultante desde la propia fila.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Rechazadas sin motivo.<\u002Fstrong> Se pierde información útil: el motivo cabe en la fila.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Duplicar escondido.<\u002Fstrong> Es una de las acciones más usadas y está en un menú. Va como secundario en la fila.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e7e9ee;border-radius:14px;overflow:hidden;background:#f4f5f7;box-shadow:0 4px 16px rgba(27,35,48,.06)\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e7e9ee\">\n        <span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9p "font-size:15px;font-weight:600;letter-spacing:-0.01em\">Rotulación Levante S.L.<\u002Fdiv>\n            <div style=\"font-size:13px;color:#6b7280\">Convertida el 12 sep en <a href=\"#\" style=\"font-family:'Geist Mono',monospace\">BP-2479<\u002Fa> · <span style=\"font-family:'Geist Mono',monospace\">4.290,00 €<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:0 1 auto\"><span style=\"padding:5px 11px;border-radius:99px;background:#eef0f4;color:#5b6472;font-size:13px;font-weight:600\">Convertida<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:auto;display:flex;align-items:center;gap:8px\">\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;border:1px solid #e7e9ee;font-size:14px;font-weight:500;color:#1b2330\">Ver pedido<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:8px;border:1px solid #e7e9ee;font-size:14px;font-weight:500;color:#1b2330\">Duplicar<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid #e7e9ee;color:#6b7280;font-size:16px\">⋯<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:12px\">Decisiones del mockup<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n        <div><strong style=\"color:#1b2330;font-weight:600\">Antigüedad en palabras.<\u002Fstrong> «Aceptada hace 3 días», «Enviada hace 41 días». Cuando pasa del umbral, la frase se tiñe de ámbar: es un aviso comercial, no un estado del sistema.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Orden por antigüedad por defecto<\u002Fstrong> en la cola de pendientes, y por fecha en las demás.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Duplicar como secundario fijo<\u002Fstrong> en todas las filas, incluidas las convertidas: es la forma real de hacer un presupuesto parecido.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">La convertida enlaza a su pedido<\u002Fstrong> desde la propia frase de estado y desde «Ver pedido».<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 6 · NUEVA PROFORMA / DUPLICAR ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">6<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Nueva proforma y duplicar<\u002Fh2>\n        <span style=\"padding:5px 11px;border-radius:99px;background:#fdeaea;color:#b42318;font-size:12px;font-weight:600\">Flujo con bugs<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Duplicar es hoy el peor momento del ERP: obliga a re-mapear todos los artículos y la pantalla se descuadra. El origen del problema es conceptual, no visual.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:16px;font-weight:600\">El diagnóstico de «duplicar»<\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;color:#6b7280;max-width:72ch\">Duplicar se implementó como «crear una proforma nueva y rellenarla con los datos de otra». Eso fuerza a que cada línea vuelva a pasar por el buscador de catálogo, y si un artículo ya no existe o cambió de referencia, el formulario se queda a medias. Para el usuario, duplicar debería significar <strong style=\"color:#1b2330;font-weight:600\">«esta proforma otra vez, y yo cambio lo que haga falta»<\u002Fstrong>.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px\">\n        <div style=\"border:1px solid #f3c9c5;border-radius:10px;padding:16px;background:#fff\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#b42318;margin-bottom:8px\">Hoy<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.7;color:#6b7280\">Formulario vacío → hay que volver a elegir empresa → cada línea se re-mapea contra el catálogo → los artículos no encontrados se pierden en silencio → el layout se rompe al meter líneas largas.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #d7e2ff;border-radius:10px;padding:16px;background:#f7faff\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#1f7a45;margin-bottom:8px\">Propuesta<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.7;color:#6b7280\">La copia llega <strong style=\"color:#1b2330;font-weight:600\">ya rellena y editable<\u002Fstrong>. Las líneas que no se pueden resolver se marcan en la propia línea con lo que hay que decidir, y el resto sigue siendo válido. Nada se pierde en silencio.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9aa2ad\">Mockup propuesto · duplicar proforma<\u002Fdiv>\n      <div style=\"border:1px solid #e7e9ee;border-radius:14px;overflow:hidden;background:#f4f5f7;box-shadow:0 4px 16px rgba(27,35,48,.06)\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e7e9ee\">\n          <span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan>\n          <span style=\"margin-left:10px;font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">bohub.bomedia.es/erp/proformas/nueva?duplicar=PR-0884<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;background:#e8f0ff;border:1px solid #d7e2ff;border-radius:12px\">\n            <span style=\"font-size:14px;font-weight:600;color:#2451c7;flex:1 1 220px\">Copia de PR-0884 · Rotulación Levante S.L.<\u002Fspan>\n            <span style=\"font-size:13px;color:#2451c7\">Todo viene rellenado. Cambia lo que necesites.<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n              <div style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:13px;font-weight:500\">Empresa<\u002Fspan>\n                <span style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-size:14px\">Rotulación Levante S.L. <span style=\"padding:2px 8px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:11px;font-weight:600\">CLI-1043<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:0 1 160px;display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:13px;font-weight:500\">Serie<\u002Fspan>\n                <span style=\"display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-size:14px;color:#6b7280\">PR 2026 <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:0 1 160px;display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:13px;font-weight:500\">Régimen de IVA<\u002Fspan>\n                <span style=\"display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-size:14px;background:#fbfbfc;color:#6b7280\">Nacional 21 %<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:0;border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n              <div style=\"display:flex;padding:10px 14px;background:#fbfbfc;border-bottom:1px solid #eef0f4;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#6b7280\">\n                <span style=\"flex:1 1 160px\">Artículo<\u002Fspan><span style=\"flex:0 0 52px;text-align:right\">Uds<\u002Fspan><span style=\"flex:0 0 90px;text-align:right\">Precio<\u002Fspan><span style=\"flex:0 0 96px;text-align:right\">Total<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid #eef0f4;font-size:14px\">\n                <span style=\"flex:1 1 160px;min-width:0\"><span style=\"font-weight:500\">artisJet 3000U<\u002Fspan><br><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#6b7280\">ART-3000U<\u002Fspan><\u002Fspan>\n                <span style=\"flex:0 0 52px;text-align:right;font-family:'Geist Mono',monospace\">1<\u002Fspan><span style=\"flex:0 0 90px;text-align:right;font-family:'Geist Mono',monospace\">3.250,00<\u002Fspan><span style=\"flex:0 0 96px;text-align:right;font-family:'Geist Mono',monospace\">3.250,00<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid #eef0f4;font-size:14px\">\n                <span style=\"flex:1 1 160px;min-width:0\"><span style=\"font-weight:500\">Tinta blanca 220 ml<\u002Fspan><br><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#6b7280\">INK-W220<\u002Fspan><\u002Fspan>\n                <span style=\"flex:0 0 52px;text-align:right;font-family:'Geist Mono',monospace\">4<\u002Fspan><span style=\"flex:0 0 90px;text-align:right;font-family:'Geist Mono',monospace\">62,50<\u002Fspan><span style=\"flex:0 0 96px;text-align:right;font-family:'Geist Mono',monospace\">250,00<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:#fdf1dd;border-bottom:1px solid #eef0f4;padding:12px 14px;display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n                  <span style=\"flex:1 1 180px;min-width:0;font-size:14px\"><span style=\"font-weight:600;color:#8a5c00\">Cabezal de repuesto DX5<\u002Fspan><br><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#8a5c00\">HEAD-DX5 · ya no está en el catálogo<\u002Fspan><\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;background:#fff;border:1px solid #e3caa0;font-size:13px;font-weight:600;color:#8a5c00\">Elegir sustituto<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:#8a5c00\">Mantener como línea libre<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:#8a5c00\">Quitar<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;padding:12px 14px;font-size:14px;color:#2451c7;font-weight:500\">+ Añadir línea del catálogo<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n              <div style=\"flex:1 1 200px;font-size:13px;line-height:1.6;color:#6b7280\">1 de 3 líneas necesita una decisión. Las otras 2 ya están listas y se guardan igual.<\u002Fdiv>\n              <div style=\"flex:0 1 240px;display:flex;flex-direction:column;gap:8px;font-size:14px\">\n                <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#6b7280\">Base<\u002Fspan><span style=\"font-family:'Geist Mono',monospace\">3.500,00 €<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#6b7280\">IVA 21 %<\u002Fspan><span style=\"font-family:'Geist Mono',monospace\">735,00 €<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid #eef0f4\"><span style=\"font-weight:600\">Total<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-weight:600\">4.235,00 €<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center\">\n            <span style=\"font-size:13px;color:#6b7280;margin-right:auto\">Se creará en FACTUSOL al guardar.<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;font-size:14px;font-weight:500\">Guardar borrador<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:8px;background:#2f6bff;color:#fff;font-size:14px;font-weight:600\">Crear proforma<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:12px\">Decisiones del mockup<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n        <div><strong style=\"color:#1b2330;font-weight:600\">Banda de procedencia.<\u002Fstrong> Una franja azul arriba dice de qué proforma es copia. El usuario nunca duda de dónde salió lo que está viendo.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">El conflicto se resuelve en la línea.<\u002Fstrong> Fondo ámbar, el motivo en lenguaje llano («ya no está en el catálogo») y tres salidas explícitas: sustituto, línea libre o quitar. Nunca un modal encima del formulario.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Lo que sí funciona no se bloquea.<\u002Fstrong> Las líneas correctas se guardan aunque quede una por decidir, y el contador lo dice: «1 de 3 líneas necesita una decisión».<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Tabla de líneas con anchos fijos<\u002Fstrong> y totales alineados a la derecha en monoespaciada. Es la causa directa del «descuadre»: hoy las columnas se dimensionan según el contenido.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Consecuencia declarada.<\u002Fstrong> «Se creará en FACTUSOL al guardar», junto al botón. El usuario no técnico necesita saber que esto sale del ERP.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Mismo formulario para nueva y duplicada.<\u002Fstrong> La única diferencia es la banda de procedencia y los campos prerrellenados.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 7 · DOCUMENTOS FACTUSOL ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">7<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Documentos FACTUSOL<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Aquí no se trabaja: se consulta y se reconcilia. Es la única pantalla del ERP que debe ser una tabla densa de verdad.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>Las pestañas por tipo de documento coinciden con el modelo mental de FACTUSOL, así que no hay que traducir nada.<\u002Fdiv>\n          <div>«Vincular a pedido» resuelve el caso real de documentos creados directamente en FACTUSOL.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">No se ve lo que está sin vincular.<\u002Fstrong> Es el motivo principal para entrar aquí. Debe haber un contador y un filtro «solo sin vincular».<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Importes sin alinear.<\u002Fstrong> Cifras en tipografía proporcional y a la izquierda: imposible comparar columnas.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Solo lectura no está declarado.<\u002Fstrong> Hay que decir en la propia pantalla que esto viene de FACTUSOL y no se edita aquí.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Sin rango de fechas.<\u002Fstrong> Para cuadrar un mes hace falta filtrar por periodo.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e7e9ee;border-radius:14px;overflow:hidden;background:#f4f5f7;box-shadow:0 4px 16px rgba(27,35,48,.06)\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e7e9ee\">\n        <span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan>\n        <span style=\"margin-left:10px;font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">bohub.bomedia.es/erp/factusol/facturas<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:18px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px\">\n          <div><h4 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em\">Documentos FACTUSOL<\u002Fh4><div style=\"font-size:13px;color:#6b7280;margin-top:4px\">Solo lectura · sincronizado hace 8 min<\u002Fdiv><\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;font-size:14px;font-weight:500\">Sincronizar ahora<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #e7e9ee;padding-bottom:0\">\n          <span style=\"padding:10px 14px;font-size:14px;color:#6b7280\">Presupuestos <span style=\"color:#6b7280\">142<\u002Fspan><\u002Fspan>\n          <span style=\"padding:10px 14px;font-size:14px;color:#6b7280\">Pedidos cliente <span style=\"color:#6b7280\">318<\u002Fspan><\u002Fspan>\n          <span style=\"padding:10px 14px;font-size:14px;color:#6b7280\">Albaranes <span style=\"color:#6b7280\">294<\u002Fspan><\u002Fspan>\n          <span style=\"padding:10px 14px;font-size:14px;font-weight:600;color:#1b2330;border-bottom:2px solid #2f6bff\">Facturas <span style=\"color:#6b7280\">276<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #d7e2ff;background:#e8f0ff;color:#2451c7;font-size:13px;font-weight:600\">Solo sin vincular · 4 <span>✕<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;color:#6b7280;font-size:13px\">Septiembre 2026 <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px soli
