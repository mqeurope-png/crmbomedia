document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h1 style=\"margin:0;font-size:40px;line-height:1.1;letter-spacing:-0.025em;font-weight:600;max-width:20ch\">Revisión de diseño del ERP<\u002Fh1>\n    <p style=\"margin:0;font-size:17px;line-height:1.6;color:#6b7280;max-width:62ch\">Diagnóstico del sistema visual y revisión pantalla por pantalla, sobre la dirección ya aprobada: bandeja de trabajo por colas y ficha de pedido como «línea de vida». Nada se elimina: se reorganiza y se clarifica.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:4px\">\n      <span style=\"display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#eef0f4;color:#5b6472;font-size:13px;font-weight:500\">Revisión completa · 11 pantallas<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#e8f0ff;color:#2451c7;font-size:13px;font-weight:500\">7 decisiones de sistema<\u002Fspan>\n      <span style=\"display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:13px;font-weight:500\">12 quick wins<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display:flex;flex-direction:column;gap:20px\">\n    <h2 style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9aa2ad\">Resumen<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#2451c7;margin-bottom:10px\">Lo que ya está bien<\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#6b7280\">La decisión de fondo es correcta: colas por acción en vez de tabla, y una acción principal por pedido. Eso quita al usuario la tarea de deducir el estado. La revisión no toca esa estructura.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:10px\">El problema real<\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#6b7280\">El estado del pedido se cuenta con texto pequeño y en varios sitios distintos. El usuario tiene que leer y comparar. La solución es una rejilla de estado fija, siempre en el mismo orden y con el mismo color.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:10px\">La palanca más grande<\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#6b7280\">Una sola escala de botones en todo el ERP: un primario por pantalla, el resto secundarios, y lo peligroso (anular) fuera del grupo. Resuelve de una vez los botones duplicados de la ficha.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ DIAGNÓSTICO DE SISTEMA ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">1<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Diagnóstico de sistema<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Siete decisiones transversales. Si se aplican antes de tocar pantallas, la mitad de los problemas de cada pantalla desaparecen solos.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 1.1 Color -->\n    <div style=\"display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:28px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em\">1.1 · Color y tokens<\u002Fh3>\n        <span style=\"padding:4px 10px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:12px;font-weight:600\">Quick win<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;color:#6b7280;max-width:70ch\">La paleta actual es sana y no hace falta cambiarla. Lo que falta es una regla de uso: hoy el mismo verde puede significar «pagado», «cobrado» y «todo correcto», y el azul se usa tanto para marca como para «por facturar». Se propone separar <strong style=\"color:#1b2330;font-weight:600\">color de marca<\u002Fstrong> (solo acciones e interacción) de <strong style=\"color:#1b2330;font-weight:600\">color de estado<\u002Fstrong> (solo informar).<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n          <div style=\"height:56px;background:#f4f5f7\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#1b2330\">--bg<\u002Fdiv><div style=\"font-size:12px;color:#9aa2ad;margin-top:2px\">#f4f5f7 · fondo app<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n          <div style=\"height:56px;background:#fff;border-bottom:1px solid #eef0f4\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#1b2330\">--card<\u002Fdiv><div style=\"font-size:12px;color:#9aa2ad;margin-top:2px\">#ffffff · tarjetas<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n          <div style=\"height:56px;background:#1b2330\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#1b2330\">--ink<\u002Fdiv><div style=\"font-size:12px;color:#9aa2ad;margin-top:2px\">#1b2330 · texto<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n          <div style=\"height:56px;background:#6b7280\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#1b2330\">--muted<\u002Fdiv><div style=\"font-size:12px;color:#9aa2ad;margin-top:2px\">#6b7280 · secundario<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n          <div style=\"height:56px;background:#2f6bff\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#1b2330\">--brand<\u002Fdiv><div style=\"font-size:12px;color:#9aa2ad;margin-top:2px\">#2f6bff · solo acción<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n          <div style=\"height:56px;background:#e7e9ee\"><\u002Fdiv>\n          <div style=\"padding:10px 12px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#1b2330\">--line<\u002Fdiv><div style=\"font-size:12px;color:#9aa2ad;margin-top:2px\">#e7e9ee · bordes<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;background:#f4f5f7;border-radius:10px;padding:18px\">\n        <div style=\"font-size:13px;font-weight:600;color:#1b2330\">Tres tokens que faltan<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6;color:#6b7280\">\n          <div><code style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#1b2330;background:#fff;padding:2px 6px;border-radius:5px;border:1px solid #e7e9ee\">--focus<\u002Fcode> &nbsp;anillo de foco visible (#2f6bff al 40 %, 3 px). Hoy el foco de teclado se pierde y en el taller se navega mucho con tabulador.<\u002Fdiv>\n          <div><code style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#1b2330;background:#fff;padding:2px 6px;border-radius:5px;border:1px solid #e7e9ee\">--ink-on-color<\u002Fcode> &nbsp;texto sobre fondos de estado. Fija el contraste mínimo 4,5:1 y evita que alguien escriba gris sobre ámbar.<\u002Fdiv>\n          <div><code style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#1b2330;background:#fff;padding:2px 6px;border-radius:5px;border:1px solid #e7e9ee\">--danger-ink<\u002Fcode> &nbsp;rojo de acción destructiva (#b42318), distinto del rojo de estado «incidencia». Anular un pedido y tener una incidencia no son lo mismo.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;color:#1b2330;margin-top:6px\">Dos correcciones sobre la paleta actual<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6;color:#6b7280\">\n          <div><code style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#1b2330;background:#fff;padding:2px 6px;border-radius:5px;border:1px solid #e7e9ee\">--faint<\u002Fcode> (#9aa2ad) da 2,5:1 sobre blanco y no llega al mínimo. Se reserva para elementos sin información: separadores, flechas de desplegable, la barra de dirección del navegador. Todo texto que aporte un dato — fechas, importes, resúmenes de panel — usa <code style=\"font-family:'Geist Mono',monospace;font-size:13px;color:#1b2330;background:#fff;padding:2px 6px;border-radius:5px;border:1px solid #e7e9ee\">--muted<\u002Fcode> (#6b7280, 4,8:1).<\u002Fdiv>\n          <div>El ámbar del brief (<span style=\"font-family:'Geist Mono',monospace;font-size:13px\">#9a6700<\u002Fspan> sobre <span style=\"font-family:'Geist Mono',monospace;font-size:13px\">#fdf1dd<\u002Fspan>) mide 4,36:1, justo por debajo del mínimo. Se propone oscurecer solo la tinta a <strong style=\"color:#1b2330;font-weight:600\">#8a5c00<\u002Fstrong>: mismo aspecto, 5,1:1. El fondo no cambia.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1.2 Tipografía -->\n    <div style=\"display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:28px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em\">1.2 · Tipografía<\u002Fh3>\n        <span style=\"padding:4px 10px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:12px;font-weight:600\">Quick win<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;color:#6b7280;max-width:70ch\">La fuente del sistema funciona, pero falta una escala cerrada: hoy conviven demasiados tamaños intermedios y eso es lo que hace que los estados «se lean pequeños». Se propone una escala de seis pasos, cuerpo a 14 px y mínimo absoluto 12 px solo para etiquetas. Y una regla nueva: <strong style=\"color:#1b2330;font-weight:600\">todo dato numérico (referencias, NIF, importes, nº de serie) en monoespaciada<\u002Fstrong>, para poder comparar y copiar sin equivocarse.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:2px;border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:14px 18px;background:#fff\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;min-width:92px\">display / 28<\u002Fspan><span style=\"font-size:28px;font-weight:600;letter-spacing:-0.02em\">Pedido BP-2481<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:14px 18px;background:#fbfbfc\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;min-width:92px\">título / 20<\u002Fspan><span style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em\">Resumen económico<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:14px 18px;background:#fff\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;min-width:92px\">subtítulo / 16<\u002Fspan><span style=\"font-size:16px;font-weight:600\">Datos fiscales<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:14px 18px;background:#fbfbfc\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;min-width:92px\">cuerpo / 14<\u002Fspan><span style=\"font-size:14px;color:#1b2330\">Impresora artisJet 3000U · 1 ud · portes incluidos<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:14px 18px;background:#fff\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;min-width:92px\">etiqueta / 12<\u002Fspan><span style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#6b7280\">Régimen de IVA<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:14px 18px;background:#fbfbfc\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;min-width:92px\">dato / mono<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-size:14px;color:#1b2330\">BP-2481 · ESB12345678 · 4.290,00 €<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1.3 Espaciado -->\n    <div style=\"display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:28px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em\">1.3 · Escala de espaciado y radios<\u002Fh3>\n        <span style=\"padding:4px 10px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:12px;font-weight:600\">Quick win<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;color:#6b7280;max-width:70ch\">Escala de 4 px, siete pasos, sin valores fuera de lista. La densidad se controla con dos ajustes y no con retoques puntuales: dentro de una tarjeta se usa 12/16 px, entre bloques 24/32 px. Radios: 8 px para controles, 12 px para tarjetas y paneles, 99 px solo para pastillas.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:4px;height:4px;background:#2f6bff;border-radius:2px\"><\u002Fdiv><span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">4<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:8px;height:8px;background:#2f6bff;border-radius:2px\"><\u002Fdiv><span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">8<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:12px;height:12px;background:#2f6bff;border-radius:2px\"><\u002Fdiv><span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">12<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:16px;height:16px;background:#2f6bff;border-radius:2px\"><\u002Fdiv><span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">16<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:24px;height:24px;background:#2f6bff;border-radius:2px\"><\u002Fdiv><span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">24<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:32px;height:32px;background:#2f6bff;border-radius:2px\"><\u002Fdiv><span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">32<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:center\"><div style=\"width:48px;height:48px;background:#2f6bff;border-radius:2px\"><\u002Fdiv><span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">48<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1.4 Pastillas de estado -->\n    <div style=\"display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:28px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em\">1.4 · Patrón de estado<\u002Fh3>\n        <span style=\"padding:4px 10px;border-radius:99px;background:#fdf1dd;color:#8a5c00;font-size:12px;font-weight:600\">Cambio mayor<\u002Fspan>\n        <span style=\"font-size:13px;color:#6b7280\">el punto de dolor nº 1<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;color:#6b7280;max-width:70ch\">Hoy el estado es texto. La propuesta es que sea <strong style=\"color:#1b2330;font-weight:600\">estructura<\u002Fstrong>: cuatro casillas fijas — Pago, Factura, Cobro, Envío — siempre en el mismo orden y en la misma posición de la fila. Verde = hecho, ámbar = pendiente, gris = no aplica todavía, rojo = bloqueado. Así el ojo aprende la posición y deja de leer.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px\">\n        <div style=\"border:1px solid #eef0f4;border-radius:12px;padding:18px;background:#fbfbfc\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#b42318;margin-bottom:14px\">Antes<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6b7280;line-height:1.7\">Pedido pagado · factura emitida · cobro pendiente · pendiente de envío<\u002Fdiv>\n          <div style=\"margin-top:14px;font-size:13px;color:#6b7280;line-height:1.6\">Cuatro datos en una frase. Hay que leerla entera, y en móvil se parte en tres líneas.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #d7e2ff;border-radius:12px;padding:18px;background:#fff\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:14px\">Después<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px 4px;border-radius:8px;background:#e7f6ec\"><span style=\"font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#1f7a45\">Pago<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#1f7a45\">Pagado<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px 4px;border-radius:8px;background:#e7f6ec\"><span style=\"font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#1f7a45\">Factura<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#1f7a45\">Emitida<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px 4px;border-radius:8px;background:#fdf1dd\"><span style=\"font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#8a5c00\">Cobro<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#8a5c00\">Pendiente<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px 4px;border-radius:8px;background:#eef0f4\"><span style=\"font-size:10px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#5b6472\">Envío<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#5b6472\">—<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;font-size:13px;color:#6b7280;line-height:1.6\">Posición fija. Se lee de un vistazo y funciona sin distinguir colores, porque cada casilla lleva su palabra.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:4px\">\n        <div style=\"font-size:13px;font-weight:600;color:#1b2330\">Pastillas: un solo tamaño por contexto<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n          <span style=\"padding:5px 11px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:13px;font-weight:600\">Pagado<\u002Fspan>\n          <span style=\"padding:5px 11px;border-radius:99px;background:#fdf1dd;color:#8a5c00;font-size:13px;font-weight:600\">Pendiente<\u002Fspan>\n          <span style=\"padding:5px 11px;border-radius:99px;background:#e8f0ff;color:#2451c7;font-size:13px;font-weight:600\">Por facturar<\u002Fspan>\n          <span style=\"padding:5px 11px;border-radius:99px;background:#e6f5f3;color:#0f766e;font-size:13px;font-weight:600\">Manual<\u002Fspan>\n          <span style=\"padding:5px 11px;border-radius:99px;background:#f0e9fd;color:#6d3fc4;font-size:13px;font-weight:600\">Intracomunitario<\u002Fspan>\n          <span style=\"padding:5px 11px;border-radius:99px;background:#fdeaea;color:#b42318;font-size:13px;font-weight:600\">Incidencia<\u002Fspan>\n          <span style=\"padding:5px 11px;border-radius:99px;background:#eef0f4;color:#5b6472;font-size:13px;font-weight:600\">Archivada<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#6b7280;max-width:70ch\">Regla: las pastillas <strong style=\"color:#1b2330;font-weight:600\">informan, nunca se pulsan<\u002Fstrong>. Si algo es pulsable es un botón o un chip de filtro, y se distingue por el borde. Hoy esa frontera no está clara en la bandeja.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1.5 Tablas vs tarjetas -->\n    <div style=\"display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:28px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em\">1.5 · Tablas o tarjetas<\u002Fh3>\n        <span style=\"padding:4px 10px;border-radius:99px;background:#fdf1dd;color:#8a5c00;font-size:12px;font-weight:600\">Cambio mayor<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.65;color:#6b7280;max-width:70ch\">La inconsistencia actual viene de no tener criterio. Se propone uno, y solo uno:<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n        <div style=\"border:1px solid #eef0f4;border-radius:12px;padding:18px;background:#fbfbfc\">\n          <div style=\"font-size:15px;font-weight:600;margin-bottom:8px\">Fila de trabajo<\u002Fdiv>\n          <p style=\"margin:0 0 10px;font-size:14px;line-height:1.6;color:#6b7280\">Cuando cada elemento tiene una acción propia y hay que decidir sobre él. Fila alta, rejilla de estado, botón de siguiente acción.<\u002Fp>\n          <div style=\"font-size:13px;color:#6b7280;line-height:1.6\">Bandeja de pedidos · Proformas · Cola SAT<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:12px;padding:18px;background:#fbfbfc\">\n          <div style=\"font-size:15px;font-weight:600;margin-bottom:8px\">Tabla de consulta<\u002Fdiv>\n          <p style=\"margin:0 0 10px;font-size:14px;line-height:1.6;color:#6b7280\">Cuando se mira para comparar cifras y fechas. Densa, alineación numérica a la derecha, monoespaciada, cabecera fija.<\u002Fp>\n          <div style=\"font-size:13px;color:#6b7280;line-height:1.6\">Documentos FACTUSOL · Líneas de pedido · Actividad de empresa<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:12px;padding:18px;background:#fbfbfc\">\n          <div style=\"font-size:15px;font-weight:600;margin-bottom:8px\">Panel de ficha<\u002Fdiv>\n          <p style=\"margin:0 0 10px;font-size:14px;line-height:1.6;color:#6b7280\">Pares etiqueta/valor de una sola entidad. Dos columnas en escritorio, una en móvil, nunca tabla.<\u002Fp>\n          <div style=\"font-size:13px;color:#6b7280;line-height:1.6\">Resumen económico · FACTUSOL · Datos fiscales<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#6b7280;max-width:70ch\">En móvil, toda tabla de consulta se convierte en lista de pares etiqueta/valor. No hay scroll horizontal en ninguna pantalla: en el taller nadie va a arrastrar una tabla de lado.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 1.6 Formularios y modales -->\n    <div style=\"display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:28px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em\">1.6 · Formularios, modales y jerarquía de acciones<\u002Fh3>\n        <span style=\"padding:4px 10px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:12px;font-weight:600\">Quick win<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:15px;font-weight:600\">Escala de botones<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:8px;background:#2f6bff;color:#fff;font-size:14px;font-weight:600\">Emitir factura<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:8px;background:#fff;color:#1b2330;border:1px solid #e7e9ee;font-size:14px;font-weight:500\">Descargar PDF<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:8px;background:transparent;color:#6b7280;font-size:14px;font-weight:500\">Enviar por email<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:8px;background:#fff;color:#b42318;border:1px solid #f3c9c5;font-size:14px;font-weight:500\">Anular<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.7;color:#6b7280\">\n            <div><strong style=\"color:#1b2330;font-weight:600\">Primario<\u002Fstrong> — uno por pantalla, siempre la siguiente acción del sistema.<\u002Fdiv>\n            <div><strong style=\"color:#1b2330;font-weight:600\">Secundario<\u002Fstrong> — con borde, para lo que se hace a menudo pero no ahora.<\u002Fdiv>\n            <div><strong style=\"color:#1b2330;font-weight:600\">Terciario<\u002Fstrong> — sin caja, dentro del panel al que pertenece.<\u002Fdiv>\n            <div><strong style=\"color:#1b2330;font-weight:600\">Destructivo<\u002Fstrong> — separado del grupo, con confirmación escrita.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#6b7280;background:#f4f5f7;border-radius:10px;padding:14px\">Altura mínima 40 px en escritorio y <strong style=\"color:#1b2330;font-weight:600\">48 px en móvil<\u002Fstrong>. Esto resuelve los targets táctiles del taller.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:15px;font-weight:600\">Un único molde de modal<\u002Fdiv>\n          <div style=\"border:1px solid #e7e9ee;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(27,35,48,.08)\">\n            <div style=\"padding:16px 18px;border-bottom:1px solid #eef0f4;display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div><div style=\"font-size:16px;font-weight:600\">Registrar cobro<\u002Fdiv><div style=\"font-size:13px;color:#6b7280;margin-top:3px\">Factura F-2026/118 · 4.290,00 €<\u002Fdiv><\u002Fdiv>\n              <span style=\"color:#9aa2ad;font-size:18px;line-height:1\">✕<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:18px;display:flex;flex-direction:column;gap:14px;background:#fbfbfc\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;font-weight:500;color:#1b2330\">Importe cobrado<\u002Fspan><span style=\"display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;background:#fff;font-family:'Geist Mono',monospace;font-size:14px\">4.290,00 €<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;font-weight:500;color:#1b2330\">Forma de pago<\u002Fspan><span style=\"display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;background:#fff;font-size:14px;color:#6b7280\">Transferencia <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:14px 18px;border-top:1px solid #eef0f4;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end\">\n              <span style=\"display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:8px;border:1px solid #e7e9ee;font-size:14px;font-weight:500;color:#1b2330\">Cancelar<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:8px;background:#2f6bff;color:#fff;font-size:14px;font-weight:600\">Registrar cobro<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.7;color:#6b7280\">Cabecera con título y contexto, cuerpo con scroll propio, pie fijo con la acción a la derecha. Ancho máximo 520 px (formulario) o 720 px (buscador con resultados). En móvil ocupa toda la pantalla desde abajo. Los modales «descuadrados» se arreglan fijando este molde y prohibiendo anchos ad hoc.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1.7 Responsive -->\n    <div style=\"display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:28px;box-shadow:0 1px 2px rgba(27,35,48,.04)\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px\">\n        <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em\">1.7 · Responsive y accesibilidad<\u002Fh3>\n        <span style=\"padding:4px 10px;border-radius:99px;background:#e8f0ff;color:#2451c7;font-size:12px;font-weight:600\">Transversal<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px\">\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;padding:16px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#2f6bff;margin-bottom:6px\">≥ 1280<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:#6b7280\">Ficha a dos columnas: línea de vida a la izquierda, paneles a la derecha.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;padding:16px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#2f6bff;margin-bottom:6px\">768 – 1279<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:#6b7280\">Una columna. Los paneles pasan debajo. Colas en fila con scroll táctil.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;padding:16px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#2f6bff;margin-bottom:6px\">&lt; 768<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:#6b7280\">Acción principal fija abajo. Paneles plegados. Rejilla de estado en 2×2.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #eef0f4;border-radius:10px;padding:16px\"><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#2f6bff;margin-bottom:6px\">Mínimos<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:#6b7280\">Contraste 4,5:1 · target 48 px · foco visible · nunca solo color.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ PANTALLA 1: BANDEJA ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">2<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Bandeja de pedidos<\u002Fh2>\n        <span style=\"padding:5px 11px;border-radius:99px;background:#fdeaea;color:#b42318;font-size:12px;font-weight:600\">Pantalla de más uso<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Es la pantalla donde se empieza el día. Su trabajo es responder a una sola pregunta: <em>¿qué tengo que hacer ahora?<\u002Fem><\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>Las colas con contador son el acierto central: reemplazan el filtrado manual por una decisión ya tomada.<\u002Fdiv>\n          <div>Una acción principal por pedido evita que el usuario tenga que saber cuál es el siguiente paso del proceso.<\u002Fdiv>\n          <div>Las alertas accionables sacan los bloqueos a la superficie en vez de esconderlos dentro de la ficha.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">Estado en prosa.<\u002Fstrong> Va en texto pequeño y en una frase. Se sustituye por la rejilla de 4 casillas en posición fija.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Filtros ausentes o escondidos.<\u002Fstrong> Faltan origen/tienda, facturado o no, y orden por fecha. Además, al filtrar no queda claro qué está activo.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Colas y filtros compiten.<\u002Fstrong> Son dos mecanismos distintos con el mismo aspecto. Hay que separarlos visualmente: la cola es <em>dónde estoy<\u002Fem>, el filtro es <em>qué veo dentro<\u002Fem>.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Origen poco visible.<\u002Fstrong> Saber si un pedido viene de boprint, artisJet, fluxlasers o es manual cambia cómo se trata, y hoy cuesta verlo.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Sin selección múltiple.<\u002Fstrong> Imprimir seis albaranes son hoy seis viajes a la ficha.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MOCKUP BANDEJA -->\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9aa2ad\">Mockup propuesto<\u002Fspan>\n        <span style=\"font-size:13px;color:#6b7280\">escritorio · datos de ejemplo<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #e7e9ee;border-radius:14px;overflow:hidden;background:#f4f5f7;box-shadow:0 4px 16px rgba(27,35,48,.06)\">\n        <!-- chrome -->\n        <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e7e9ee\">\n          <span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan>\n          <span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan>\n          <span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan>\n          <span style=\"margin-left:10px;font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">bohub.bomedia.es/erp/pedidos<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- topbar app -->\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 18px;background:#fff;border-bottom:1px solid #e7e9ee\">\n          <div style=\"display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-0.01em\"><span style=\"display:inline-block;width:20px;height:20px;border-radius:6px;background:#2f6bff\"><\u002Fspan>BoHub<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:4px;font-size:13px\">\n            <span style=\"padding:6px 10px;border-radius:7px;background:#eef0f4;color:#1b2330;font-weight:600\">Pedidos<\u002Fspan>\n            <span style=\"padding:6px 10px;border-radius:7px;color:#6b7280\">Proformas<\u002Fspan>\n            <span style=\"padding:6px 10px;border-radius:7px;color:#6b7280\">Empresas<\u002Fspan>\n            <span style=\"padding:6px 10px;border-radius:7px;color:#6b7280\">FACTUSOL<\u002Fspan>\n            <span style=\"padding:6px 10px;border-radius:7px;color:#6b7280\">SAT<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px\">\n            <span style=\"display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-size:13px;color:#9aa2ad;min-width:180px\">Buscar pedido, empresa o NIF<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:99px;background:#eef0f4;font-size:12px;font-weight:600;color:#5b6472\">MB<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:20px 18px 24px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px\">\n            <div>\n              <h4 style=\"margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em\">Bandeja de pedidos<\u002Fh4>\n              <div style=\"font-size:13px;color:#6b7280;margin-top:4px\">34 pedidos abiertos · 3 con incidencia<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;font-size:14px;font-weight:500\">Nueva proforma<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;background:#2f6bff;color:#fff;font-size:14px;font-weight:600\">Nuevo pedido<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- COLAS -->\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#1b2330;color:#fff;min-height:44px\"><span style=\"font-size:14px;font-weight:600\">Por revisar<\u002Fspan><span style=\"padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600\">6<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #e7e9ee;min-height:44px\"><span style=\"font-size:14px;font-weight:500;color:#1b2330\">Por facturar<\u002Fspan><span style=\"padding:2px 8px;border-radius:99px;background:#e8f0ff;color:#2451c7;font-size:12px;font-weight:600\">9<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #e7e9ee;min-height:44px\"><span style=\"font-size:14px;font-weight:500;color:#1b2330\">Por cobrar<\u002Fspan><span style=\"padding:2px 8px;border-radius:99px;background:#fdf1dd;color:#8a5c00;font-size:12px;font-weight:600\">12<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #e7e9ee;min-height:44px\"><span style=\"font-size:14px;font-weight:500;color:#1b2330\">Por enviar<\u002Fspan><span style=\"padding:2px 8px;border-radius:99px;background:#e6f5f3;color:#0f766e;font-size:12px;font-weight:600\">4<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #f3c9c5;min-height:44px\"><span style=\"font-size:14px;font-weight:600;color:#b42318\">Incidencias<\u002Fspan><span style=\"padding:2px 8px;border-radius:99px;background:#fdeaea;color:#b42318;font-size:12px;font-weight:600\">3<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #e7e9ee;min-height:44px\"><span style=\"font-size:14px;font-weight:500;color:#6b7280\">Listo<\u002Fspan><span style=\"padding:2px 8px;border-radius:99px;background:#eef0f4;color:#5b6472;font-size:12px;font-weight:600\">218<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- FILTROS -->\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;background:#fff;border:1px solid #e7e9ee;border-radius:12px\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-right:2px\">Filtrar<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #d7e2ff;background:#e8f0ff;color:#2451c7;font-size:13px;font-weight:600\">Tienda: artisJet <span style=\"color:#2f6bff\">✕<\u002Fspan><\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;color:#6b7280;font-size:13px\">Origen: todos <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;color:#6b7280;font-size:13px\">Facturado: no <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;color:#6b7280;font-size:13px\">Régimen: todos <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan>\n            <span style=\"margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;color:#1b2330;font-size:13px;font-weight:500\">Más recientes primero <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan>\n            <span style=\"font-size:13px;color:#2451c7;font-weight:500\">Limpiar<\u002Fspan>\n          <\u002Fdiv>\n\n          <!-- FILA 1: incidencia -->\n          <div style=\"background:#fff;border:1px solid #f3c9c5;border-radius:12px;overflow:hidden\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px\">\n              <div style=\"flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:6px\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                  <span style=\"font-family:'Geist Mono',monospace;font-size:15px;font-weight:500;color:#1b2330\">AJ-2481<\u002Fspan>\n                  <span style=\"padding:3px 8px;border-radius:99px;background:#f0e9fd;color:#6d3fc4;font-size:11px;font-weight:600\">artisJet · Woo<\u002Fspan>\n                  <span style=\"padding:3px 8px;border-radius:99px;background:#f0e9fd;color:#6d3fc4;font-size:11px;font-weight:600\">Intracomunitario<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">Grafische Werkstatt Mülle ase;color:#5b6472\">Envío<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#5b6472\">—<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-left:auto;display:flex;align-items:center;gap:8px\">\n              <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;background:#2f6bff;color:#fff;font-size:14px;font-weight:600\">Emitir factura<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid #e7e9ee;color:#6b7280;font-size:16px\">⋯<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:4px\">Decisiones del mockup<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">Cola activa en oscuro.<\u002Fstrong> La cola seleccionada es la única en negativo: se ve de lejos dónde estás. Las demás son cápsulas con borde, y el contador lleva el color de su cola.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Barra de filtros separada.<\u002Fstrong> Vive en su propia tarjeta, debajo de las colas, con etiqueta «Filtrar». Los filtros activos se pintan en azul con una ✕; «Limpiar» siempre visible.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Orden a la derecha.<\u002Fstrong> Un solo desplegable con la frase entera («Más recientes primero»), no un icono de flechas.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Rejilla de estado fija.<\u002Fstrong> Cuatro casillas en el centro de la fila, misma posición en todas. La incidencia pinta de rojo la casilla concreta que está bloqueada.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Origen y régimen como pastillas.<\u002Fstrong> Tienda y régimen de IVA van junto a la referencia, donde se leen antes de decidir.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Una acción + menú.<\u002Fstrong> El primario es la siguiente acción; todo lo demás (PDF, email, anular, abrir en FACTUSOL) vive en el «⋯». Nada desaparece.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Alerta dentro de la fila.<\u002Fstrong> La franja roja se pega abajo de la tarjeta afectada y explica el bloqueo en una frase, sin jerga.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ mostrarMovil }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9aa2ad\">Móvil · taller<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n        <div style=\"flex:0 1 340px;border:1px solid #e7e9ee;border-radius:20px;background:#f4f5f7;padding:10px;box-shadow:0 4px 16px rgba(27,35,48,.06)\">\n          <div style=\"background:#fff;border-radius:14px;overflow:hidden\">\n            <div style=\"padding:14px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"font-size:16px;font-weight:600;letter-spacing:-0.01em\">Por cobrar<\u002Fspan>\n              <span style=\"padding:3px 9px;border-radius:99px;background:#fdf1dd;color:#8a5c00;font-size:12px;font-weight:600\">12<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:12px;display:flex;flex-direction:column;gap:10px;background:#f4f5f7\">\n              <div style=\"display:flex;gap:8px;overflow:hidden\">\n                <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;background:#1b2330;color:#fff;font-size:13px;font-weight:600;white-space:nowrap\">Por cobrar 12<\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;background:#fff;border:1px solid #e7e9ee;font-size:13px;color:#6b7280;white-space:nowrap\">Por enviar 4<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n                  <span style=\"font-family:'Geist Mono',monospace;font-size:14px;font-weight:500\">BP-2479<\u002Fspan>\n                  <span style=\"padding:2px 7px;border-radius:99px;background:#e8f0ff;color:#2451c7;font-size:11px;font-weight:600\">boprint<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">Rotulación Levante S.L.<\u002Fdiv>\n                <div style=\"font-size:13px;color:#6b7280\">13 sep · <span style=\"font-family:'Geist Mono',monospace\">4.290,00 €<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:#e7f6ec\"><span style=\"font-size:11px;font-weight:600;text-transform:uppercase;color:#1f7a45\">Pago<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#1f7a45\">OK<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:#e7f6ec\"><span style=\"font-size:11px;font-weight:600;text-transform:uppercase;color:#1f7a45\">Factura<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#1f7a45\">OK<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:#fdf1dd\"><span style=\"font-size:11px;font-weight:600;text-transform:uppercase;color:#8a5c00\">Cobro<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#8a5c00\">Pend.<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:#eef0f4\"><span style=\"font-size:11px;font-weight:600;text-transform:uppercase;color:#5b6472\">Envío<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#5b6472\">—<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;background:#2f6bff;color:#fff;font-size:15px;font-weight:600\">Registrar cobro<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 280px;font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:10px;align-self:center\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">La rejilla pasa a 2×2<\u002Fstrong> con etiqueta a la izquierda y valor a la derecha. Sigue siendo posición fija.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Las colas se deslizan en horizontal<\u002Fstrong>, con la activa siempre a la izquierda.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">El botón principal ocupa todo el ancho<\u002Fstrong> y mide 48 px. Es lo único pulsable a distancia de pulgar.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Nada de scroll horizontal<\u002Fstrong>: el importe y la fecha se apilan bajo el nombre.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <!-- ══════════ PANTALLA 2: FICHA DE PEDIDO ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">3<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Ficha de pedido<\u002Fh2>\n        <span style=\"padding:5px 11px;border-radius:99px;background:#fdeaea;color:#b42318;font-size:12px;font-weight:600\">Pantalla de más uso<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">La «línea de vida» es una buena idea mal servida por la densidad. El pedido tiene siete pasos, pero la pantalla presenta doce bloques a la vez y varios botones que hacen lo mismo.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>El stepper de 7 pasos con la acción incrustada en el paso actual es el patrón correcto: enseña el proceso mientras se trabaja.<\u002Fdiv>\n          <div>Tener el panel FACTUSOL a la vista evita el salto constante al software de facturación para comprobar si algo está ya emitido.<\u002Fdiv>\n          <div>El timeline da trazabilidad, que en administración vale mucho cuando hay que justificar algo.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">Acciones duplicadas.<\u002Fstrong> Dos botones de factura (cabecera y paso) que parecen distintos y hacen lo mismo. La regla: <em>la acción vive en el paso; la cabecera solo tiene lo que aplica a todo el pedido<\u002Fem>.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Todo abierto a la vez.<\u002Fstrong> Doce bloques compiten. Lo relevante ahora debe estar abierto; el resto, plegado con su resumen en la cabecera del panel.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Stepper horizontal que se rompe.<\u002Fstrong> Siete pasos no caben en pantalla de taller. Vertical funciona en todos los anchos y deja sitio para la acción y el detalle de cada paso.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">«Anular» junto al resto.<\u002Fstrong> Una acción irreversible no puede estar en la misma fila que «Descargar PDF».<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Estado económico disperso.<\u002Fstrong> Base, IVA, total, cobrado y pendiente aparecen en sitios distintos. Un solo panel con «pendiente de cobro» destacado.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MOCKUP FICHA -->\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px\">\n        <span
