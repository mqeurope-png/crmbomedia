 solid #eef0f4;font-size:13px;background:#fbfbfc\">\n            <span style=\"flex:0 0 96px;font-family:'Geist Mono',monospace\">F-2026/117<\u002Fspan><span style=\"flex:1 1 140px;min-width:0\">Laser Studio Zürich AG<\u002Fspan><span style=\"flex:0 0 72px;color:#6b7280\">11 sep<\u002Fspan><span style=\"flex:0 0 100px;text-align:right;font-family:'Geist Mono',monospace\">12.450,00<\u002Fspan><span style=\"flex:0 0 96px;text-align:right\"><span style=\"padding:2px 8px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:11px;font-weight:600\">Cobrada<\u002Fspan><\u002Fspan><span style=\"flex:0 0 108px;text-align:right;font-family:'Geist Mono',monospace\"><a href=\"#\">FL-2476<\u002Fa><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;padding:13px 16px;border-bottom:1px solid #eef0f4;font-size:13px;border-left:3px solid #8a5c00\">\n            <span style=\"flex:0 0 96px;font-family:'Geist Mono',monospace\">F-2026/116<\u002Fspan><span style=\"flex:1 1 140px;min-width:0\">Serigrafía Duero S.C.<\u002Fspan><span style=\"flex:0 0 72px;color:#6b7280\">9 sep<\u002Fspan><span style=\"flex:0 0 100px;text-align:right;font-family:'Geist Mono',monospace\">890,00<\u002Fspan><span style=\"flex:0 0 96px;text-align:right\"><span style=\"padding:2px 8px;border-radius:99px;background:#fdf1dd;color:#8a5c00;font-size:11px;font-weight:600\">Pendiente<\u002Fspan><\u002Fspan><span style=\"flex:0 0 108px;text-align:right\"><span style=\"display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:7px;border:1px solid #e7e9ee;font-size:12px;font-weight:600;color:#2451c7\">Vincular<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;padding:13px 16px;font-size:13px;background:#fbfbfc\">\n            <span style=\"flex:0 0 96px;font-family:'Geist Mono',monospace\">F-2026/115<\u002Fspan><span style=\"flex:1 1 140px;min-width:0\">Grafische Werkstatt Müller GmbH<\u002Fspan><span style=\"flex:0 0 72px;color:#6b7280\">8 sep<\u002Fspan><span style=\"flex:0 0 100px;text-align:right;font-family:'Geist Mono',monospace\">3.780,00<\u002Fspan><span style=\"flex:0 0 96px;text-align:right\"><span style=\"padding:2px 8px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:11px;font-weight:600\">Cobrada<\u002Fspan><\u002Fspan><span style=\"flex:0 0 108px;text-align:right;font-family:'Geist Mono',monospace\"><a href=\"#\">AJ-2455<\u002Fa><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:12px\">Decisiones del mockup<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n        <div><strong style=\"color:#1b2330;font-weight:600\">«Solo sin vincular» con contador<\u002Fstrong> como filtro destacado: la razón número uno para abrir esta pantalla queda a un clic.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Lo no vinculado se marca en la fila<\u002Fstrong> con una banda ámbar a la izquierda y el botón «Vincular» donde iría el número de pedido.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Números en monoespaciada<\u002Fstrong> y alineados a la derecha, con la columna de importe de ancho fijo. Así se pueden sumar de un vistazo.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">«Solo lectura · sincronizado hace 8 min»<\u002Fstrong> bajo el título, más «Sincronizar ahora». Explica de dónde salen los datos sin jerga.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Rango de mes<\u002Fstrong> por defecto en el mes en curso, para cuadrar cierres.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">En móvil, cada fila es una tarjeta<\u002Fstrong> de pares etiqueta/valor. Sin scroll horizontal.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 8 · COLA SAT ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">8<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Cola SAT (taller)<\u002Fh2>\n        <span style=\"padding:5px 11px;border-radius:99px;background:#e6f5f3;color:#0f766e;font-size:12px;font-weight:600\">Pantalla pequeña<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Es la única pantalla que se usa de pie, con las manos ocupadas y a veces con guantes. Debe diseñarse primero para móvil y solo después para escritorio.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>Los datos elegidos son los correctos: nº de serie, licencia WhiteRIP, origen y observaciones es exactamente lo que el taller necesita.<\u002Fdiv>\n          <div>«Marcar procesado» cierra el bucle sin pasar por administración.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">Datos técnicos en texto pequeño.<\u002Fstrong> El nº de serie y la licencia se teclean o se comparan con el equipo físico: van grandes, en monoespaciada y con botón de copiar.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Observaciones enterradas.<\u002Fstrong> Si el comercial escribió algo, es lo primero que el taller debe leer.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Botones pequeños.<\u002Fstrong> En taller, 48 px mínimo y separados para no pulsar el equivocado.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Historial de enviados incompleto.<\u002Fstrong> Hace falta saber a qué hora se envió y quién lo hizo, para no duplicar envíos.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n      <div style=\"flex:0 1 360px;border:1px solid #e7e9ee;border-radius:20px;background:#f4f5f7;padding:10px;box-shadow:0 4px 16px rgba(27,35,48,.06)\">\n        <div style=\"background:#fff;border-radius:14px;overflow:hidden\">\n          <div style=\"padding:14px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;justify-content:space-between;gap:10px\">\n            <span style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em\">Cola SAT<\u002Fspan>\n            <span style=\"padding:3px 9px;border-radius:99px;background:#e6f5f3;color:#0f766e;font-size:12px;font-weight:600\">4 por preparar<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:12px;background:#f4f5f7;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;gap:8px\">\n              <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600;white-space:nowrap\">Por preparar<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:8px;background:#fff;border:1px solid #e7e9ee;font-size:14px;color:#6b7280;white-space:nowrap\">Enviados<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                <span style=\"font-family:'Geist Mono',monospace;font-size:15px;font-weight:500\">FL-2476<\u002Fspan>\n                <span style=\"padding:2px 8px;border-radius:99px;background:#e6f5f3;color:#0f766e;font-size:11px;font-weight:600\">fluxlasers<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em;line-height:1.3\">Laser Studio Zürich AG<\u002Fdiv>\n              <div style=\"padding:14px;border-radius:10px;background:#fdf1dd;display:flex;flex-direction:column;gap:4px\">\n                <span style=\"font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#8a5c00\">Observaciones del comercial<\u002Fspan>\n                <span style=\"font-size:15px;line-height:1.5;color:#7a4f00\">Cliente pide embalaje reforzado y manual en alemán. Avisar antes de enviar.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid #eef0f4;border-radius:10px\">\n                  <span style=\"font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#6b7280\">Nº de serie<\u002Fspan>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\"><span style=\"font-family:'Geist Mono',monospace;font-size:19px;font-weight:500\">FLX-7741-2026<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid #e7e9ee;color:#2451c7;font-size:13px;font-weight:600\">⧉<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid #eef0f4;border-radius:10px\">\n                  <span style=\"font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#6b7280\">Licencia WhiteRIP<\u002Fspan>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\"><span style=\"font-family:'Geist Mono',monospace;font-size:19px;font-weight:500\">WR-4C-88231<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid #e7e9ee;color:#2451c7;font-size:13px;font-weight:600\">⧉<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <div style=\"display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;background:#2f6bff;color:#fff;font-size:15px;font-weight:600\">Enviar a SAT por email<\u002Fdiv>\n                <div style=\"display:flex;gap:8px\">\n                  <div style=\"flex:1;display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;border:1px solid #e7e9ee;font-size:15px;font-weight:500\">Albarán PDF<\u002Fdiv>\n                  <div style=\"flex:1;display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;border:1px solid #e7e9ee;font-size:15px;font-weight:500\">Procesado<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 280px;background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:12px\">Decisiones del mockup<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">Observaciones arriba y en ámbar.<\u002Fstrong> Si hay una nota del comercial, es lo primero. Si no hay, el bloque no aparece.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Datos técnicos a 19 px en monoespaciada<\u002Fstrong>, cada uno en su caja con botón de copiar de 36 px. Se leen a un brazo de distancia.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Tres acciones, 48 px, en dos filas.<\u002Fstrong> El primario solo y ancho; las dos secundarias debajo, separadas.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Pestaña «Enviados»<\u002Fstrong> con hora y responsable de cada envío, para no repetir.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">En escritorio, la misma tarjeta en rejilla de dos o tres columnas.<\u002Fstrong> No se convierte en tabla: el taller no compara, ejecuta.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 9 · CREAR Y BUSCAR EMPRESA ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">9<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Buscar y crear empresa<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Son dos pantallas pero un solo flujo: buscar, y si no existe, crear sin perder lo escrito. Es donde se generan los duplicados que luego cuesta limpiar.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>Buscar por nombre, CIF y dominio a la vez cubre cómo busca la gente de verdad.<\u002Fdiv>\n          <div>Marcar si está en FACTUSOL o solo en CRM en el propio resultado evita elegir mal.<\u002Fdiv>\n          <div>El régimen deducido del país y la validación VIES integrada son la pieza más valiosa del formulario.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">Anti-duplicados avisa tarde.<\u002Fstrong> Debe avisar al teclear el NIF, no al guardar, y mostrar la ficha candidata con un botón «Usar esta».<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">«Crear también en FACTUSOL» sin consecuencias explicadas.<\u002Fstrong> Una casilla que crea un registro fiscal necesita una frase que diga qué implica.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">VIES sin estados intermedios.<\u002Fstrong> Comprobando, válido, no válido y servicio caído son cuatro situaciones distintas y hoy se ven casi igual.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">El modal cambia de tamaño<\u002Fstrong> al aparecer resultados. Ancho fijo de 720 px y la lista con scroll propio.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n      <div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9aa2ad\">Buscador · modal de 720 px<\u002Fdiv>\n        <div style=\"border:1px solid #e7e9ee;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(27,35,48,.08)\">\n          <div style=\"padding:16px 18px;border-bottom:1px solid #eef0f4;display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n            <div><div style=\"font-size:16px;font-weight:600\">Asignar empresa<\u002Fdiv><div style=\"font-size:13px;color:#6b7280;margin-top:3px\">Contacto: Ana Ferrer<\u002Fdiv><\u002Fdiv>\n            <span style=\"color:#9aa2ad;font-size:18px;line-height:1\">✕<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:16px 18px;border-bottom:1px solid #eef0f4\">\n            <span style=\"display:flex;align-items:center;height:44px;padding:0 14px;border:1px solid #2f6bff;border-radius:8px;font-size:15px;box-shadow:0 0 0 3px rgba(47,107,255,.2)\">rotulacion<\u002Fspan>\n            <div style=\"font-size:13px;color:#6b7280;margin-top:8px\">Busca por nombre, CIF o dominio de email.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"max-height:260px;overflow:hidden\">\n            <div style=\"padding:14px 18px;border-bottom:1px solid #eef0f4;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n              <div style=\"flex:1 1 180px;min-width:0\"><div style=\"font-size:15px;font-weight:600\">Rotulación Levante S.L.<\u002Fdiv><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#6b7280;margin-top:3px\">ESB98765432 · ejemplo.es<\u002Fdiv><\u002Fdiv>\n              <span style=\"padding:3px 9px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:11px;font-weight:600\">En FACTUSOL<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;background:#2f6bff;color:#fff;font-size:13px;font-weight:600\">Usar esta<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:14px 18px;border-bottom:1px solid #eef0f4;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n              <div style=\"flex:1 1 180px;min-width:0\"><div style=\"font-size:15px;font-weight:600\">Rotulación del Sur S.L.U.<\u002Fdiv><div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#6b7280;margin-top:3px\">ESB11223344 · sin dominio<\u002Fdiv><\u002Fdiv>\n              <span style=\"padding:3px 9px;border-radius:99px;background:#e6f5f3;color:#0f766e;font-size:11px;font-weight:600\">Solo CRM<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;border:1px solid #e7e9ee;font-size:13px;font-weight:500;color:#1b2330\">Usar esta<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px 18px;border-top:1px solid #eef0f4;background:#fbfbfc;display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n            <span style=\"flex:1 1 160px;font-size:13px;color:#6b7280\">¿No está en la lista?<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:8px;border:1px solid #e7e9ee;background:#fff;font-size:14px;font-weight:600;color:#2451c7\">Crear empresa «rotulacion»<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9aa2ad\">Crear empresa · identificación fiscal<\u002Fdiv>\n        <div style=\"border:1px solid #e7e9ee;border-radius:12px;background:#fff;padding:18px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;font-weight:500\">Nombre fiscal<\u002Fspan>\n            <span style=\"display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-size:14px\">Grafische Werkstatt Müller GmbH<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n            <div style=\"flex:0 1 150px;display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:13px;font-weight:500\">País<\u002Fspan>\n              <span style=\"display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-size:14px\">Alemania <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 180px;display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:13px;font-weight:500\">NIF / VAT<\u002Fspan>\n              <span style=\"display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-family:'Geist Mono',monospace;font-size:14px\">DE811907980<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px;border-radius:10px;background:#f0e9fd\">\n            <span style=\"flex:1 1 180px;font-size:14px;line-height:1.5;color:#5b2fa8\"><strong style=\"font-weight:600\">Régimen detectado: intracomunitario exento.<\u002Fstrong> La factura saldrá sin IVA si el VAT es válido.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px;border-radius:10px;background:#e7f6ec\">\n            <span style=\"flex:1 1 160px;font-size:14px;color:#186b3c\"><strong style=\"font-weight:600\">VAT válido en VIES<\u002Fstrong> · comprobado hoy a las 11:42<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:8px;background:#fff;border:1px solid #bfe3cc;font-size:13px;font-weight:500;color:#186b3c\">Volver a comprobar<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;padding:14px;border:1px solid #e7e9ee;border-radius:10px\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:#2f6bff;color:#fff;font-size:12px;font-weight:700;flex:0 0 auto\">✓<\u002Fspan>\n            <span style=\"flex:1 1 200px;font-size:14px;line-height:1.55\"><strong style=\"font-weight:600\">Crear también en FACTUSOL<\u002Fstrong><br><span style=\"color:#6b7280\">Se dará de alta como cliente en el software de facturación. Hace falta para poder emitir facturas a esta empresa.<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end\">\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;border:1px solid #e7e9ee;font-size:14px;font-weight:500\">Cancelar<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:8px;background:#2f6bff;color:#fff;font-size:14px;font-weight:600\">Crear empresa<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:12px\">Decisiones del mockup<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n        <div><strong style=\"color:#1b2330;font-weight:600\">Lo escrito se arrastra.<\u002Fstrong> «Crear empresa «rotulacion»» lleva el texto ya tecleado al formulario. Nadie vuelve a escribir.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">El vínculo decide el botón.<\u002Fstrong> «En FACTUSOL» da un primario azul; «Solo CRM» da un secundario, porque hará falta vincularla antes de facturar.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Régimen explicado, no etiquetado.<\u002Fstrong> El bloque morado dice qué consecuencia tiene: «La factura saldrá sin IVA si el VAT es válido».<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">VIES con cuatro estados<\u002Fstrong> y siempre con la hora de comprobación, más «Volver a comprobar» a mano.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">La casilla de FACTUSOL explica su efecto<\u002Fstrong> en dos líneas, debajo de su etiqueta.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Anti-duplicados al teclear el NIF:<\u002Fstrong> si coincide, aparece la ficha existente con «Usar esta» antes de dejar seguir.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 10 · NUEVO PEDIDO MANUAL ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">10<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Nuevo pedido manual<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Exige empresa vinculada a FACTUSOL. Ese requisito es correcto, pero hoy aparece como error al final en vez de guiar desde el principio.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>Exigir el vínculo con FACTUSOL antes de crear el pedido evita el trabajo sucio después.<\u002Fdiv>\n          <div>Portes y dirección de envío como campos propios reflejan cómo se venden estos equipos.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">El requisito se descubre tarde.<\u002Fstrong> Al elegir una empresa solo-CRM debe aparecer ahí mismo el aviso y el botón «Vincular ahora», sin salir del formulario.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Estructura plana.<\u002Fstrong> Tres bloques claros — empresa, líneas, envío — con el total siempre visible, resuelven el formulario largo.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Mismo componente de líneas que la proforma.<\u002Fstrong> Hoy son dos tablas distintas y se comportan distinto.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Dirección de envío sin atajo.<\u002Fstrong> Debe ofrecer la dirección de la empresa con un clic y permitir otra.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e7e9ee;border-radius:14px;overflow:hidden;background:#f4f5f7;box-shadow:0 4px 16px rgba(27,35,48,.06)\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e7e9ee\">\n        <span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan>\n        <span style=\"margin-left:10px;font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">bohub.bomedia.es/erp/pedidos/nuevo<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:18px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n        <div style=\"flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-size:15px;font-weight:600\">1 · Empresa<\u002Fdiv>\n            <span style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-size:14px\">Rotulación del Sur S.L.U. <span style=\"padding:2px 8px;border-radius:99px;background:#e6f5f3;color:#0f766e;font-size:11px;font-weight:600\">Solo CRM<\u002Fspan><\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px;border-radius:10px;background:#fdf1dd\">\n              <span style=\"flex:1 1 200px;font-size:14px;line-height:1.5;color:#7a4f00\"><strong style=\"font-weight:600;color:#8a5c00\">Esta empresa aún no está en FACTUSOL.<\u002Fstrong> Sin ella no se puede emitir factura. Se puede vincular sin salir de aquí.<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:8px;background:#fff;border:1px solid #e3caa0;font-size:14px;font-weight:600;color:#8a5c00\">Vincular ahora<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-size:15px;font-weight:600\">2 · Líneas<\u002Fdiv>\n            <div style=\"border:1px solid #eef0f4;border-radius:10px;overflow:hidden\">\n              <div style=\"display:flex;padding:10px 14px;background:#fbfbfc;border-bottom:1px solid #eef0f4;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#6b7280\"><span style=\"flex:1 1 140px\">Artículo<\u002Fspan><span style=\"flex:0 0 48px;text-align:right\">Uds<\u002Fspan><span style=\"flex:0 0 88px;text-align:right\">Precio<\u002Fspan><span style=\"flex:0 0 92px;text-align:right\">Total<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid #eef0f4;font-size:14px\"><span style=\"flex:1 1 140px;min-width:0\"><span style=\"font-weight:500\">MBO Láser 60W<\u002Fspan><br><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#6b7280\">MBO-L60<\u002Fspan><\u002Fspan><span style=\"flex:0 0 48px;text-align:right;font-family:'Geist Mono',monospace\">1<\u002Fspan><span style=\"flex:0 0 88px;text-align:right;font-family:'Geist Mono',monospace\">5.900,00<\u002Fspan><span style=\"flex:0 0 92px;text-align:right;font-family:'Geist Mono',monospace\">5.900,00<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;padding:12px 14px;font-size:14px;color:#2451c7;font-weight:500\">+ Añadir línea del catálogo<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-size:15px;font-weight:600\">3 · Envío<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n              <div style=\"flex:0 1 150px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;font-weight:500\">Portes<\u002Fspan><span style=\"display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-family:'Geist Mono',monospace;font-size:14px\">120,00 €<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1 1 200px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:13px;font-weight:500\">Dirección de envío<\u002Fspan><span style=\"display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-size:14px;color:#6b7280\">La de la empresa <span style=\"color:#9aa2ad\">▾<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:18px\">\n            <div style=\"font-size:15px;font-weight:600;margin-bottom:14px\">Total del pedido<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#6b7280\">Artículos<\u002Fspan><span style=\"font-family:'Geist Mono',monospace\">5.900,00 €<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#6b7280\">Portes<\u002Fspan><span style=\"font-family:'Geist Mono',monospace\">120,00 €<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#6b7280\">IVA 21 %<\u002Fspan><span style=\"font-family:'Geist Mono',monospace\">1.264,20 €<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:12px;padding-top:9px;border-top:1px solid #eef0f4\"><span style=\"font-weight:600\">Total<\u002Fspan><span style=\"font-family:'Geist Mono',monospace;font-weight:600;font-size:17px\">7.284,20 €<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:13px;color:#6b7280;line-height:1.6\">Al crear el pedido se dará de alta también en FACTUSOL como pedido de cliente.<\u002Fdiv>\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;height:44px;border-radius:8px;background:#e7e9ee;color:#9aa2ad;font-size:14px;font-weight:600\">Crear pedido<\u002Fspan>\n            <div style=\"font-size:13px;color:#8a5c00;line-height:1.5\">Falta vincular la empresa a FACTUSOL.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:12px\">Decisiones del mockup<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n        <div><strong style=\"color:#1b2330;font-weight:600\">Tres pasos numerados<\u002Fstrong> en vez de un formulario continuo: empresa, líneas, envío. Sin ocultar nada.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">El bloqueo se explica donde ocurre<\u002Fstrong> y trae su solución: aviso ámbar junto a la empresa con «Vincular ahora».<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Botón desactivado con motivo escrito debajo.<\u002Fstrong> Nunca un botón gris sin explicación.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Total siempre visible<\u002Fstrong> en el panel derecho, que en móvil pasa a barra fija inferior.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ 11 · AJUSTES ERP ══════════ -->\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">11<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Ajustes ERP<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Se entra poco, pero cada cambio afecta a todos los pedidos. La prioridad no es la eficiencia: es que se entienda qué hace cada ajuste y se pueda comprobar.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #1f7a45;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#1f7a45;margin-bottom:12px\">Qué funciona<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div>Agrupar por tienda es lo correcto: cada tienda tiene su prefijo, su remitente y sus series.<\u002Fdiv>\n          <div>Tener las plantillas de email por idioma en el ERP evita depender de nadie para un cambio de texto.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-left:3px solid #8a5c00;border-radius:12px;padding:20px\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8a5c00;margin-bottom:12px\">Qué mejorar<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.7;color:#6b7280;display:flex;flex-direction:column;gap:8px\">\n          <div><strong style=\"color:#1b2330;font-weight:600\">Ajustes sin ejemplo.<\u002Fstrong> «Prefijo de referencia» no dice nada; «BP- → BP-2479» sí. Cada campo con su resultado al lado.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Plantillas sin previsualización.<\u002Fstrong> Se edita a ciegas. Hace falta «Ver ejemplo» y «Enviarme una prueba».<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Mapeo de series sin jerga traducida.<\u002Fstrong> Es lo más técnico de la pantalla y necesita una frase que explique para qué sirve.<\u002Fdiv>\n          <div><strong style=\"color:#1b2330;font-weight:600\">Guardado ambiguo.<\u002Fstrong> Un solo «Guardar cambios» por sección, con aviso si se sale sin guardar.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #e7e9ee;border-radius:14px;overflow:hidden;background:#f4f5f7;box-shadow:0 4px 16px rgba(27,35,48,.06)\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e7e9ee\">\n        <span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:99px;background:#e7e9ee\"><\u002Fspan>\n        <span style=\"margin-left:10px;font-family:'Geist Mono',monospace;font-size:11px;color:#9aa2ad\">bohub.bomedia.es/erp/ajustes<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:18px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n        <div style=\"flex:0 1 200px;background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px\">\n          <span style=\"padding:10px 12px;border-radius:8px;background:#eef0f4;font-size:14px;font-weight:600\">Tiendas y referencias<\u002Fspan>\n          <span style=\"padding:10px 12px;border-radius:8px;font-size:14px;color:#6b7280\">Remitentes de email<\u002Fspan>\n          <span style=\"padding:10px 12px;border-radius:8px;font-size:14px;color:#6b7280\">Plantillas por idioma<\u002Fspan>\n          <span style=\"padding:10px 12px;border-radius:8px;font-size:14px;color:#6b7280\">Series FACTUSOL<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px\">\n            <div>\n              <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em\">Tiendas y referencias<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6b7280;line-height:1.6;margin-top:6px\">El prefijo es lo que va delante del número de pedido. Se usa para saber de qué tienda viene cada uno.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;border:1px solid #eef0f4;border-radius:10px\">\n                <span style=\"flex:1 1 130px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:99px;background:#2451c7\"><\u002Fspan>boprint<\u002Fspan>\n                <span style=\"flex:0 1 110px;display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-family:'Geist Mono',monospace;font-size:14px\">BP-<\u002Fspan>\n                <span style=\"flex:1 1 160px;font-size:13px;color:#6b7280\">Siguiente referencia: <span style=\"font-family:'Geist Mono',monospace;color:#1b2330\">BP-2482<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;border:1px solid #eef0f4;border-radius:10px\">\n                <span style=\"flex:1 1 130px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:99px;background:#6d3fc4\"><\u002Fspan>artisjet<\u002Fspan>\n                <span style=\"flex:0 1 110px;display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-family:'Geist Mono',monospace;font-size:14px\">AJ-<\u002Fspan>\n                <span style=\"flex:1 1 160px;font-size:13px;color:#6b7280\">Siguiente referencia: <span style=\"font-family:'Geist Mono',monospace;color:#1b2330\">AJ-2482<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;border:1px solid #eef0f4;border-radius:10px\">\n                <span style=\"flex:1 1 130px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600\"><span style=\"display:inline-block;width:8px;height:8px;border-radius:99px;background:#0f766e\"><\u002Fspan>fluxlasers<\u002Fspan>\n                <span style=\"flex:0 1 110px;display:flex;align-items:center;height:40px;padding:0 12px;border:1px solid #e7e9ee;border-radius:8px;font-family:'Geist Mono',monospace;font-size:14px\">FL-<\u002Fspan>\n                <span style=\"flex:1 1 160px;font-size:13px;color:#6b7280\">Siguiente referencia: <span style=\"font-family:'Geist Mono',monospace;color:#1b2330\">FL-2477<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;padding-top:4px;border-top:1px solid #eef0f4\">\n              <span style=\"font-size:13px;color:#6b7280;margin-right:auto\">Cambiar un prefijo no afecta a los pedidos ya creados.<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:8px;background:#2f6bff;color:#fff;font-size:14px;font-weight:600\">Guardar cambios<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n            <div style=\"flex:1 1 200px;min-width:0\"><div style=\"font-size:15px;font-weight:600\">Plantilla «Factura al cliente» · español<\u002Fdiv><div style=\"font-size:13px;color:#6b7280;margin-top:3px\">Última edición hace 3 meses<\u002Fdiv><\u002Fdiv>\n            <span style=\"display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:8px;border:1px solid #e7e9ee;font-size:14px;font-weight:500;color:#1b2330\">Ver ejemplo<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:8px;border:1px solid #e7e9ee;font-size:14px;font-weight:500;color:#1b2330\">Enviarme una prueba<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:20px\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:#9aa2ad;margin-bottom:12px\">Decisiones del mockup<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-size:14px;line-height:1.6;color:#6b7280\">\n        <div><strong style=\"color:#1b2330;font-weight:600\">Cada ajuste con su resultado al lado.<\u002Fstrong> Al cambiar el prefijo, «Siguiente referencia: BP-2482» se actualiza en vivo.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Explicación en lenguaje llano<\u002Fstrong> bajo cada título de sección, una sola frase.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Color de tienda coherente<\u002Fstrong> con las pastillas de origen de la bandeja: el mismo punto de color en todo el ERP.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Plantillas con «Ver ejemplo» y «Enviarme una prueba»<\u002Fstrong>, para no editar a ciegas.<\u002Fdiv>\n        <div><strong style=\"color:#1b2330;font-weight:600\">Un «Guardar cambios» por sección<\u002Fstrong>, con la consecuencia escrita al lado.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ PRIORIDADES ══════════ -->\n  <sc-if value=\"{{ mostrarPrioridades }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid #e7e9ee;padding-top:40px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#1b2330;color:#fff;font-size:14px;font-weight:600\">12<\u002Fspan>\n        <h2 style=\"margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Prioridades<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#6b7280;max-width:66ch\">Ordenado por impacto en el trabajo diario. Los quick wins de arriba se pueden hacer sin tocar la arquitectura.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:22px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n          <span style=\"padding:4px 10px;border-radius:99px;background:#e7f6ec;color:#1f7a45;font-size:12px;font-weight:600\">Quick wins<\u002Fspan>\n          <span style=\"font-size:13px;color:#9aa2ad\">bajo esfuerzo · alto impacto<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">01<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Rejilla de estado de 4 casillas<\u002Fstrong> en la bandeja, en posición fija. Resuelve el punto de dolor nº 1.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">02<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Barra de filtros<\u002Fstrong> con tienda, facturado, régimen y orden por fecha, más chips activos y «Limpiar».<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">03<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Quitar los botones duplicados<\u002Fstrong> de la ficha: la acción vive en su paso, la cabecera repite solo el primario.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">04<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Aislar «Anular»<\u002Fstrong> con confirmación escrita, fuera del grupo de acciones.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">05<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Escala de tipografía y espaciado<\u002Fstrong> cerrada, con monoespaciada para todo dato numérico.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">06<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Altura mínima 48 px<\u002Fstrong> en móvil y anillo de foco visible en todos los controles.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">07<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Pastilla de origen y régimen<\u002Fstrong> junto a la referencia en todas las listas.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">08<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Migas que recuerdan la cola<\u002Fstrong> de procedencia al volver de la ficha.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">09<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Filtro «solo sin vincular» con contador<\u002Fstrong> en Documentos FACTUSOL, más importes en monoespaciada alineados a la derecha.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">10<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Antigüedad en palabras<\u002Fstrong> en proformas («hace 41 días») y orden por antigüedad en la cola de pendientes.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">11<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Datos técnicos a 19 px con botón de copiar<\u002Fstrong> y observaciones arriba en la cola SAT.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">12<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Cada ajuste con su resultado al lado<\u002Fstrong> y una frase de explicación por sección en Ajustes ERP.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #e7e9ee;border-radius:12px;padding:22px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n          <span style=\"padding:4px 10px;border-radius:99px;background:#fdf1dd;color:#8a5c00;font-size:12px;font-weight:600\">Cambios mayores<\u002Fspan>\n          <span style=\"font-size:13px;color:#9aa2ad\">requieren refactor<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">13<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Duplicar proforma como copia editable<\u002Fstrong>, con los conflictos resueltos en la propia línea y guardado parcial. Es el cambio de mayor impacto después de la bandeja.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">14<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Línea de vida vertical<\u002Fstrong> con acción y datos por paso, sustituyendo el stepper horizontal.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">15<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Paneles plegables con resumen<\u002Fstrong> en la cabecera de cada uno, y memoria del estado abierto/cerrado por usuario.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">16<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Molde único de modal<\u002Fstrong> aplicado a todos los flujos, con dos anchos permitidos.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">17<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Componente único de líneas<\u002Fstrong> compartido por proforma y pedido manual, con anchos de columna fijos.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">18<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Anti-duplicados al teclear el NIF<\u002Fstrong> en el alta de empresa, con la ficha candidata y «Usar esta».<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">19<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Actividad de empresa unificada<\u002Fstrong> en una tabla con filtro por tipo, en lugar de tres listas.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">20<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Criterio tabla / fila de trabajo / panel<\u002Fstrong> aplicado a las 11 pantallas, con tablas que se convierten en pares etiqueta/valor en móvil.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Geist Mono',monospace;font-size:12px;color:#9aa2ad;padding-top:2px\">21<\u002Fspan><div style=\"font-size:14px;line-height:1.6\"><strong style=\"font-weight:600\">Selección múltiple<\u002Fstrong> en bandeja, proformas y cola SAT, con acciones en lote.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#1b2330;color:#fff;border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9aa2ad\">Orden de ejecución sugerido<\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;line-height:1.65;color:#e7e9ee;max-width:70ch\">Primero los quick wins 01–08, que se concentran en bandeja y ficha y afectan a todo el equipo cada día. Después el 13, duplicar proforma, que es el único punto donde el ERP hace perder tiempo de forma activa. El resto puede ir entrando por pantalla, aprovechando que la 14–17 comparten componentes.<\u002Fp>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:#c7ccd4;max-width:70ch\">Nota: la revisión se ha hecho sobre el brief y la dirección aprobada. Con las capturas reales de cada pantalla se pueden señalar defectos concretos de implementación que el brief no recoge, sobre todo en los modales y en el descuadre de duplicar.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mostrarMovil&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenido&quot;},&quot;mostrarPrioridades&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenido&quot;}}\">class Component extends DCLogic {\n  renderVals() {\n    return {\n      mostrarMovil: this.props.mostrarMovil ?? true,\n      mostrarPrioridades: this.props.mostrarPrioridades ?? true,\n    };\n  }\n}<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
