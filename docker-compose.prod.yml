# Production stack for CRMBO Media CRM.
#
# Usage:
#   1. Copy .env.production.example to .env.production and fill in real values.
#   2. Obtain TLS certs on the host (see docs/deployment-ionos.md).
#   3. Edit deploy/nginx/conf.d/app.conf with your domain.
#   4. docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Differences vs. docker-compose.yml (development):
#   - Database and Redis are NOT exposed on the host network.
#   - DATABASE_URL, SECRET_KEY and admin credentials come from .env.production only.
#   - Nginx is the only public-facing service (80/443).
#   - Containers use restart: unless-stopped and bounded log files.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    build: ./backend
    image: crmbomedia-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      EMAIL_ASSETS_DIR: /opt/crmbo/uploads/email-templates
      # BoHub ERP Fase D — storage de albaranes/etiquetas en disco del VPS.
      STORAGE_BACKEND: local
      LOCAL_SHIPPING_STORAGE_DIR: /opt/crmbo/uploads/erp-shipping
      # D-1-fix2: token del mu-plugin `bohub-albaran` (mismo en las 3 tiendas).
      # Valor real en .env.production; vacío → el CRM genera el albarán.
      WOOCOMMERCE_ALBARAN_TOKEN: ${WOOCOMMERCE_ALBARAN_TOKEN:-}
    volumes:
      # Bind mount instead of a named volume so nginx can alias the
      # same `/opt/crmbo/uploads/email-templates/` path on the host —
      # named volumes live under /var/lib/docker/volumes/ and were
      # invisible from nginx's perspective.
      - /opt/crmbo/uploads/email-templates:/opt/crmbo/uploads/email-templates
      # BoHub ERP Fase D — ficheros de expedición (albarán/etiqueta). Bind
      # mount para que persistan fuera del contenedor (backup Plesk lo cubre).
      - /opt/crmbo/uploads/erp-shipping:/opt/crmbo/uploads/erp-shipping
      # Sprint Backup-Hardening. `/admin/backups/{id}/download` lee
      # el archivo cifrado producido por el worker. Sin este bind, el
      # FileResponse del api 404 — el worker crea el binario en su
      # propio FS porque ambos contenedores ven el host.
      - /var/backups/crmbo:/var/backups/crmbo
      # Sprint-Backfill-Gmail. Adjuntos descargados por el backfill.
      # Same volume mounted in worker-sync para que el api pueda servirlos
      # via /api/email-messages/{id}/attachments/{id}/download.
      - crmbo_email_attachments:/var/lib/crmbo/attachments
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  worker-sync:
    image: crmbomedia-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
    # PR-Fix-Worker-Dedicado-Workflows. Worker A: SOLO queues de sync
    # externo + housekeeping. La queue `workflows:dispatch` se mudó al
    # worker-workflows para no quedarse en posición 22 de 24 esperando
    # eternamente — RQ procesa queues en orden de la lista, y las
    # syncs de Agile/Brevo nunca dejan idle al worker durante mucho
    # rato.
    #
    # RQ default serializer (pickle) es fine porque el worker comparte
    # imagen Docker con el api service, productor y consumidor hablan
    # el mismo Python.
    command:
      - rq
      - worker
      # --with-scheduler aplica para los heartbeats self-rescheduling
      # de Brevo (auto-sync targets + campaign cache refresh) y
      # Agile (periodic_read) via enqueue_in.
      - --with-scheduler
      - --url
      - redis://redis:6379/0
      # PR-Fix-Web-Ingest-Starvation. AgileCRM (agilecrm:*) se mudó a
      # `worker-agilecrm` y la ingesta web (woocommerce:*) a `worker-web`.
      # Antes ambas vivían aquí: AgileCRM era la cola #1 y sus
      # `sync_contacts` paginan miles de contactos por cada una de las ~9
      # cuentas, así que copaban este worker durante horas. RQ procesa las
      # colas EN ORDEN dentro de un worker, de modo que los webhooks de
      # WooCommerce (cola #35) no se procesaban hasta que Agile lo
      # liberaba → los pedidos web se atascaban. Aislando ambos en su
      # propio worker, este `worker-sync` queda para Brevo/Gmail/Factusol/
      # Freshdesk/backups/Genei sin que Agile ni la web se estorben.
      - brevo:sync_contacts
      - brevo:push_target
      - brevo:auto_sync_check
      - brevo:push_contact
      - brevo:webhook_process
      - brevo:refresh_campaigns
      - brevo:refresh_segments
      - brevo:refresh_segment
      - brevo:periodic_read
      - brevo:periodic_segments
      - brevo:periodic_push
      - brevo:historical_backfill
      - freshdesk:sync_tickets
      - factusol:sync_invoices
      - gmail:process_history
      - gmail:renew_watches
      - gmail:backfill_historic
      # PR-Auto-Backfill-Gmail-Por-Contacto. Mini-backfill del histórico
      # Gmail de un contacto recién creado. Se procesa de uno en uno;
      # cada job tiene timeout de 300s y va al final de las colas Gmail
      # para no retrasar el sync incremental ni el process_history.
      - gmail:backfill_per_contact
      # PR-OAuth-Permisos-Admin Items 9 + 13. Crons del ciclo de vida
      # OAuth: aviso de caducidad de token (horario), digest admin
      # (diario), sync de Send-As aliases (diario).
      - gmail:token_expiry_check
      - gmail:admin_digest
      - gmail:sync_aliases
      - gmail:poll_fallback
      - emails:snooze_sweep
      - email_templates:import_gmail
      # Sprint Backup. Cola virtual para el job manual + scheduled
      # cada 72 h. `backups:create` cubre los dos caminos.
      - backups:create
      # BoHub ERP Fase B/B-4. Genei (etiquetas + tracking async). Las
      # colas de INGESTA WEB (woocommerce:*) se mudaron a `worker-web`
      # (PR-Fix-Web-Ingest-Starvation) para que un pedido entre en
      # segundos siempre; Genei no es ruta crítica de pedido y se queda
      # aquí:
      #  - genei:shipments → descarga de etiqueta PDF + subida a HiDrive.
      #  - genei:webhooks  → integration_events del notificationUrl de Genei.
      - genei:shipments
      - genei:webhooks
    volumes:
      # Sprint Backup-Hardening. El worker ejecuta
      # `scripts/backup-crmbo.sh` via subprocess: necesita el script
      # legible (la imagen ya lo lleva via `COPY scripts ./scripts`,
      # pero exponerlo desde el host hace que actualizaciones del
      # script no requieran rebuild de la imagen).
      - /opt/crmbo/scripts:/scripts:ro
      # Destino del archivo cifrado. Compartido con el api para que
      # el endpoint /download lo encuentre.
      - /var/backups/crmbo:/var/backups/crmbo
      # El script lee MYSQL_ROOT_PASSWORD y
      # BACKUP_ENCRYPTION_PASSPHRASE del .env.production. Read-only
      # — el worker NUNCA debe modificarlo.
      - /opt/crmbo/.env.production:/opt/crmbo/.env.production:ro
      # Sprint-Backfill-Gmail. Adjuntos descargados por el job. Mismo
      # volumen que api para que el download endpoint vea los ficheros.
      - crmbo_email_attachments:/var/lib/crmbo/attachments
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # PR-Fix-Web-Ingest-Starvation. Worker DEDICADO a la ingesta web. Solo ve
  # las colas woocommerce:* — nunca lo bloquea AgileCRM ni ningún otro sync,
  # así que un webhook de WooCommerce (pedido web) se procesa en segundos
  # SIEMPRE. `woocommerce:webhooks` va PRIMERO (máxima prioridad dentro del
  # worker); import/backfill son operaciones manuales de la UI admin.
  # Comparte imagen con el api (mismo Python → serializer pickle OK).
  worker-web:
    image: crmbomedia-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
    command:
      - rq
      - worker
      - --url
      - redis://redis:6379/0
      - woocommerce:webhooks
      - woocommerce:import
      - woocommerce:backfill
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # PR-Fix-Web-Ingest-Starvation. Worker de BAJA PRIORIDAD, aislado, para
  # AgileCRM (en retirada). Sus `sync_contacts` paginan miles de contactos por
  # cuenta y tienen el worker ocupado mucho rato; aislados aquí ya no estorban
  # a la ingesta web ni al resto de syncs. `--with-scheduler` alimenta el
  # heartbeat self-rescheduling de `agilecrm:periodic_read`, que encola
  # `sync_contacts` cada AGILECRM_SYNC_INTERVAL_HOURS (default 1) — la lista
  # sube periodic_read primero para que el tick horario nunca se retrase
  # detrás de un sync largo. El scheduler ya no re-encola una cuenta que
  # tenga un sync pendiente/en curso (dedup en `periodic_read_check`).
  worker-agilecrm:
    image: crmbomedia-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
    command:
      - rq
      - worker
      - --with-scheduler
      - --url
      - redis://redis:6379/0
      - agilecrm:periodic_read
      - agilecrm:sync_contacts
      - agilecrm:purge_quota
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-workflows:
    image: crmbomedia-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
    # PR-Fix-Worker-Dedicado-Workflows. Worker B dedicado al motor de
    # workflows. Antes vivía en el mismo worker que las syncs y se
    # quedaba en cola de 24 queues — los 9 syncs Agile + Brevo polling
    # + gmail history + freshdesk + factusol + backups copaban al
    # worker, así que `workflows:dispatch` (posición 22) nunca tenía
    # CPU. En producción se acumularon 1380 jobs durante 6 horas; al
    # arrancar el worker en burst envió emails inesperados.
    #
    # Separar en 2 procesos: este worker SOLO ve workflows. Los
    # eventos `contact.created` dispatched desde un sync (vía
    # `dispatch_event`) los procesa en milisegundos sin esperar a que
    # el sync termine.
    command:
      - rq
      - worker
      # --with-scheduler powers `workflows:scheduler` (heartbeat
      # periódico que despierta waits + cron workflows via enqueue_in).
      - --with-scheduler
      - --url
      - redis://redis:6379/0
      # Sprint Workflows Bloque 1. Tres colas:
      # - `workflows:dispatch` — eventos entrantes (contact.created,
      #   email.opened, etc.) que evalúan workflows matching.
      # - `workflows:execute` — runs ya iniciados que avanzan step a step.
      # - `workflows:scheduler` — heartbeat periódico (cada 30 s)
      #   que despierta waits + cron workflows.
      - workflows:dispatch
      - workflows:execute
      - workflows:scheduler
      # Fase VIES: barrido periódico (self-rescheduling, necesita
      # --with-scheduler) de los NIF-IVA pendientes de veredicto.
      - vies:sweep
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # BoHub ERP Fase C · C-2. Worker DEDICADO a las escrituras FACTUSOL, con
  # concurrencia 1 (un solo proceso, cola única `factusol:writes`): la
  # numeración de facturas se calcula con SELECT MAX(CODFAC)+1 justo antes de
  # escribir, así que dos emisiones en paralelo pisarían el número. NO escalar
  # a más réplicas sin resolver antes la numeración distribuida (lock Redis).
  worker-factusol:
    image: crmbomedia-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
    command:
      - rq
      - worker
      - --url
      - redis://redis:6379/0
      # ERP-jobs-interactivos: los trabajos que un usuario lanza y espera
      # mirando (reconciliación de estados Woo) van AQUÍ, no en worker-sync
      # (saturado con los batch horarios). Va PRIMERO = prioridad sobre las
      # escrituras FACTUSOL (que son breves y poco frecuentes). worker-factusol
      # está ocioso salvo al emitir, así que el job se coge enseguida.
      - erp:interactive
      - factusol:writes
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # PR-CRM-GMAIL-fix1. Worker dedicado SOLO a colas Gmail (post PR #329).
  # Motivo: el worker-sync se satura con el bucle de sync AgileCRM
  # (paginación de miles de contactos) y RQ procesa colas secuencial
  # dentro de un worker → gmail:process_history acumulaba jobs sin
  # procesar (Pub/Sub llegaba pero el mail nunca aparecía en CRM en
  # real-time). worker-sync sigue escuchando estas colas también; RQ
  # reparte jobs entre workers cuando 2+ escuchan la misma cola, así
  # ganamos capacidad sin tocar la config existente.
  worker-gmail:
    image: crmbomedia-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
    command:
      - rq
      - worker
      - --with-scheduler
      - --url
      - redis://redis:6379/0
      - gmail:process_history
      - gmail:renew_watches
      - gmail:backfill_historic
      - gmail:backfill_per_contact
      - gmail:token_expiry_check
      - gmail:admin_digest
      - gmail:sync_aliases
      - gmail:poll_fallback
    volumes:
      - crmbo_email_attachments:/var/lib/crmbo/attachments
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    image: crmbomedia-frontend:latest
    restart: unless-stopped
    # SEC-1 — endurecimiento tras el incidente de agosto-2026 (minero +
    # rootkit DENTRO del contenedor). Defensa en profundidad: la imagen ya
    # corre como usuario `nextjs` sin privilegios (Dockerfile); aquí además:
    # - read_only: el rootfs es inmutable — no se puede escribir
    #   /etc/ld.so.preload, ni crontabs, ni soltar binarios (./XXbIBGhJ).
    #   Solo /tmp y la cache de Next son escribibles, en tmpfs (RAM,
    #   se vacían al recrear el contenedor).
    # - no-new-privileges: sin escaladas via setuid/setgid.
    # - cap_drop ALL: sin capabilities de kernel.
    # Sigue SIN publicar puertos al host y SIN montar docker.sock.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 0o1777
      - type: tmpfs
        target: /app/.next/cache
        tmpfs:
          mode: 0o1777
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      # Email-template inline images served straight off disk; read-only
      # mirror of the api container's write path. Bind mount so the
      # host path matches what the nginx alias expects.
      - /opt/crmbo/uploads/email-templates:/opt/crmbo/uploads/email-templates:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  certbot_webroot:
  # Sprint-Backfill-Gmail. Binarios de adjuntos descargados por el
  # backfill, organizados por contact_id/message_id/filename. Backup
  # 72h incluye este volumen via scripts/backup-crmbo.sh (montado en
  # api + worker-sync; el tar entra al GPG).
  crmbo_email_attachments:
